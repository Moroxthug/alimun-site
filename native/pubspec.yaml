name: alimun
description: "Alimun"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  flutter_svg: ^2.4.0
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  intl: ^0.20.3
  http: ^1.6.0
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/art/
    - assets/countries.json
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Variable.ttf
    - family: Coolvetica
      fonts:
        - asset: assets/fonts/coolvetica-condensed-rg.otf
