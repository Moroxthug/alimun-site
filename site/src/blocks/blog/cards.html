        <style>
          /* Blog cards (the strip on every page, "Keep reading"): on white, a rounded photo with the card shadow, then
             the title in Coolvetica and a short line of text, like the photo tiles of the About page. The photo zooms
             out slightly on hover and the "read" link gets the lime marker. Cards rise in as they reach the screen. */
          .section.bl-strip { padding: 7rem 0 3rem; background-color: var(--white); }
          .bl-strip_head { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; margin-bottom: 3.5rem; }
          .bl-strip_head h2 { margin: 0; }
          .bl-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.5rem; }
          .bl-card { display: flex; flex-direction: column; color: var(--black); text-decoration: none; }
          .bl-card_photo { position: relative; display: block; aspect-ratio: 4 / 3.4; border-radius: 3.125rem; overflow: hidden; margin-bottom: 1.75rem; }
          .bl-card_photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); transition: transform 1.2s cubic-bezier(.215, .61, .355, 1); }
          .bl-card:hover .bl-card_photo img { transform: scale(1); }
          .bl-card_meta { font-size: .875rem; line-height: 1.4; color: rgba(8, 8, 8, .55); margin-bottom: .6rem; }
          .bl-card_title { font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: clamp(1.6rem, 2.2vw, 2rem); line-height: 1.05; margin-bottom: .75rem; }
          .bl-card_desc { font-size: 1rem; line-height: 1.6; color: rgba(8, 8, 8, .7); }
          .bl-card_go { align-self: flex-start; margin-top: 1.1rem; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: 1.1rem; padding: 0 .15em;
            background-image: linear-gradient(var(--green), var(--green)); background-repeat: no-repeat; background-position: 0 88%; background-size: 100% 35%; transition: background-size .5s cubic-bezier(.215, .61, .355, 1); }
          .bl-card:hover .bl-card_go { background-size: 100% 100%; }
          .bl-rise { opacity: 0; transform: translateY(2.5rem); transition: opacity .8s ease, transform .9s cubic-bezier(.215, .61, .355, 1); }
          .bl-rise.is-in { opacity: 1; transform: none; }
          @media (prefers-reduced-motion: reduce) { .bl-rise { opacity: 1; transform: none; transition: none; } .bl-card_photo img { transform: none; transition: none; } }
          @media (max-width: 991px) {
            .bl-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .bl-strip .bl-card:nth-child(3), .bl-more .bl-card:nth-child(3) { display: none; }
          }
          @media (max-width: 767px) {
            .section.bl-strip { padding: 4.5rem 0 1.5rem; }
            .bl-strip_head { flex-direction: column; align-items: flex-start; gap: 1.25rem; margin-bottom: 2rem; }
            .bl-cards { grid-template-columns: 1fr; gap: 2.75rem; }
            .bl-strip .bl-card:nth-child(3), .bl-more .bl-card:nth-child(3) { display: flex; }
            .bl-card_photo { border-radius: 2.25rem; margin-bottom: 1.25rem; }
          }
        </style>
        <script>
          (function () {
            function go() {
              var els = [].slice.call(document.querySelectorAll(".bl-rise:not(.is-in)"));
              if (!("IntersectionObserver" in window)) { els.forEach(function (e) { e.classList.add("is-in"); }); return; }
              var io = new IntersectionObserver(function (list) {
                list.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add("is-in"); io.unobserve(x.target); } });
              }, { threshold: 0.12, rootMargin: "0px 0px -5% 0px" });
              els.forEach(function (e) { if (e.classList.contains("bl-card")) e.style.transitionDelay = ([].indexOf.call(e.parentNode.children, e) % 3) * 0.1 + "s"; io.observe(e); });
            }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
          })();
        </script>
