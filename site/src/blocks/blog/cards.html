        <style>
          /* Blog cards, third design (owner, 26 Oct 2026): white rounded cards with a photo, the details line, the title
             in Coolvetica, a short text and a "read" link that gets the lime marker; they lift and the photo zooms on
             hover, and rise in as they reach the screen. Used on the blog pages and in the strip before the bottom banner. */
          .bm { --forest: #1a443c; --t-sun: #fff4e0; --t-mint: #eaf6f2; --t-coral: #fdeee9; --t-lime: #f4fbe0; --r-xl: 32px; --r-lg: 24px; --r-md: 16px;
            --shadow: 0 20px 60px rgba(8, 8, 8, .08); --shadow-lift: 0 26px 70px rgba(8, 8, 8, .13); --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.3, 1.5, .5, 1); font-family: Satoshi, sans-serif; color: #080808; }
          .bm-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
          .bm-card { position: relative; background: #fff; border-radius: var(--r-xl); box-shadow: var(--shadow); overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: transform .28s var(--ease), box-shadow .28s; }
          .bm-card:hover { transform: translateY(-5px) rotate(-.4deg); box-shadow: var(--shadow-lift); }
          .bm-ph { display: block; overflow: hidden; }
          .bm-card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; transition: transform 1s var(--ease); }
          .bm-card:hover img { transform: scale(1.07); }
          .bm-in { padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
          .bm-meta { font-size: 13px; line-height: 1.4; color: rgba(8, 8, 8, .58); }
          .bm-t { font-family: "Coolvetica Condensed", sans-serif; text-transform: uppercase; font-size: 26px; line-height: 1.02; }
          .bm-x { color: rgba(8, 8, 8, .68); line-height: 1.55; font-size: 15px; }
          .bm-go { margin-top: auto; padding: 6px .1em 0; align-self: flex-start; font-weight: 700; font-size: 14px; color: var(--forest); background-image: linear-gradient(#ceff65, #ceff65); background-repeat: no-repeat; background-position: 0 90%; background-size: 0% 40%; transition: background-size .4s var(--ease); }
          .bm-card:hover .bm-go { background-size: 100% 40%; }
          .rv { opacity: 0; transform: translateY(30px); transition: opacity .8s ease, transform .9s var(--ease); }
          .rv.is-in { opacity: 1; transform: none; }
          .bm-card.is-done { transition: transform .28s var(--ease), box-shadow .28s; transition-delay: 0s !important; }
          .section.bl-strip { padding: 7rem 0 3rem; }
          .bl-strip_head { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; margin-bottom: 3rem; }
          .bl-strip_head h2 { margin: 0; }
          @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } .bm-card, .bm-card img { transition: none; } }
          @media (max-width: 991px) { .bm-grid { grid-template-columns: 1fr 1fr; } .bl-strip .bm-card:nth-child(3) { display: none; } }
          @media (max-width: 640px) { .bm-grid { grid-template-columns: 1fr; } .bl-strip .bm-card:nth-child(3) { display: flex; } .section.bl-strip { padding: 4.5rem 0 1.5rem; } .bl-strip_head { flex-direction: column; align-items: flex-start; gap: 1.25rem; margin-bottom: 2rem; } }
        </style>
        <script>
          (function () {
            /* Rise in on scroll, one after another within a row; hovers respond quickly once the entrance is over */
            function go() {
              var els = [].slice.call(document.querySelectorAll(".rv:not(.is-in), .pop:not(.is-in)"));
              if (!("IntersectionObserver" in window)) { els.forEach(function (e) { e.classList.add("is-in"); }); return; }
              var io = new IntersectionObserver(function (list) {
                list.forEach(function (x) {
                  if (!x.isIntersecting) return;
                  var t = x.target; t.classList.add("is-in"); io.unobserve(t);
                  setTimeout(function () { t.classList.add("is-done"); t.style.transitionDelay = ""; }, 1500);
                });
              }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
              els.forEach(function (e) {
                var sib = [].filter.call(e.parentNode.children, function (c) { return c.classList.contains("rv") || c.classList.contains("pop"); });
                var i = sib.indexOf(e);
                if (i > 0) e.style.transitionDelay = Math.min(i, 6) * 0.08 + "s";
                io.observe(e);
              });
            }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
          })();
        </script>
