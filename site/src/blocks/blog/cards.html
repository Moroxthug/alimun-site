        <style>
          /* Blog cards: the reading strip on every page, "Keep reading" and the blog home. White, lime and ink cards
             with the site's large radius and shadow; the cover word is set huge in Coolvetica like the certificate
             panels on the course pages. Cards rise in as they reach the screen. */
          .section.bl-strip { padding: 6rem 0 2rem; }
          .bl-strip_head { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; margin-bottom: 3rem; }
          .bl-strip_head h2 { margin: 0; }
          .bl-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; }
          .bl-card { position: relative; display: flex; flex-direction: column; min-height: 30rem; border-radius: 3.125rem; overflow: hidden; padding: 2.5rem; text-decoration: none; color: var(--black); background-color: var(--white); transition: transform .6s cubic-bezier(.215, .61, .355, 1); }
          .bl-card.is-lime { background-color: var(--green); }
          .bl-card.is-ink { background-color: var(--black); color: var(--white); }
          .bl-card:hover { transform: translateY(-.5rem); }
          .bl-card_cover { display: block; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; line-height: .9; font-size: clamp(3.5rem, 6vw, 6rem); letter-spacing: -.01em; overflow-wrap: anywhere; color: rgba(8, 8, 8, .12); transition: color .6s ease; }
          .bl-card.is-lime .bl-card_cover { color: rgba(8, 8, 8, .16); }
          .bl-card.is-ink .bl-card_cover { color: var(--green); }
          .bl-card:hover .bl-card_cover { color: rgba(8, 8, 8, .3); }
          .bl-card.is-ink:hover .bl-card_cover { color: var(--green); }
          .bl-card_body { display: flex; flex-direction: column; gap: .9rem; margin-top: auto; padding-top: 2.5rem; }
          .bl-card_title { font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: 1.85rem; line-height: 1.05; }
          .bl-card_desc { font-size: 1rem; line-height: 1.55; opacity: .78; }
          .bl-card_meta { font-size: .875rem; line-height: 1.4; opacity: .6; }
          .bl-card_go { align-self: flex-start; margin-top: .5rem; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: 1.05rem; border-bottom: 2px solid currentColor; padding-bottom: .1rem; }
          .bl-card.is-ink .bl-card_go { color: var(--green); }
          .bl-rise { opacity: 0; transform: translateY(2.5rem); transition: opacity .8s ease, transform .9s cubic-bezier(.215, .61, .355, 1); }
          .bl-rise.is-in { opacity: 1; transform: none; }
          .bl-card.bl-rise.is-in:hover { transform: translateY(-.5rem); }
          @media (prefers-reduced-motion: reduce) { .bl-rise { opacity: 1; transform: none; transition: none; } .bl-card:hover { transform: none; } }
          @media (max-width: 991px) {
            .bl-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .bl-strip .bl-card:nth-child(3) { display: none; }
          }
          @media (max-width: 767px) {
            .section.bl-strip { padding: 4.5rem 0 1rem; }
            .bl-strip_head { flex-direction: column; align-items: flex-start; gap: 1.25rem; margin-bottom: 2rem; }
            .bl-cards { grid-template-columns: 1fr; gap: 1.25rem; }
            .bl-strip .bl-card:nth-child(3) { display: flex; }
            .bl-card { min-height: 0; padding: 2rem; border-radius: 2.25rem; }
            .bl-card_cover { font-size: 3.25rem; }
            .bl-card_body { padding-top: 1.75rem; }
          }
        </style>
        <script>
          (function () {
            function go() {
              var els = [].slice.call(document.querySelectorAll(".bl-rise:not(.is-in)"));
              if (!("IntersectionObserver" in window)) { els.forEach(function (e) { e.classList.add("is-in"); }); return; }
              var io = new IntersectionObserver(function (list) {
                list.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add("is-in"); io.unobserve(x.target); } });
              }, { threshold: 0.12, rootMargin: "0px 0px -5% 0px" });
              els.forEach(function (e, i) { e.style.transitionDelay = (i % 3) * 0.08 + "s"; io.observe(e); });
            }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
          })();
        </script>
