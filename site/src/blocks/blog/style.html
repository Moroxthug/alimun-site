        <script>
          (function () {
            /* "Try it": one answer per question; the right one turns lime, the explanation appears */
            function init() {

                var a = +q.getAttribute("data-a"), why = q.querySelector(".bl-q_why");
                [].forEach.call(q.querySelectorAll(".bl-opt"), function (b) {
                  b.addEventListener("click", function () {
                    if (q.classList.contains("is-done")) return;
                    q.classList.add("is-done");
                    var i = +b.getAttribute("data-i");
                    if (i !== a) b.classList.add("is-wrong");
                    q.querySelector('.bl-opt[data-i="' + a + '"]').classList.add("is-right");
                    why.textContent = (i === a ? why.getAttribute("data-ok") : why.getAttribute("data-no")) + " " + why.getAttribute("data-why");
