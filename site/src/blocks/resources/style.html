        var w = pick(D[l].wod), mean = today.querySelector("[data-wod-mean]");
        today.querySelector("[data-wod-word]").textContent = w[0];
        mean.innerHTML = ""; mean.appendChild(el("b", "", w[1])); mean.appendChild(el("br")); mean.appendChild(document.createTextNode("“" + w[2] + "”"));
        today.querySelector("[data-flip]").classList.remove("is-on"); game(); setTw();
      };
      [].forEach.call(document.querySelectorAll(".rs-toggle button"), function (b) { b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); }); });
      setLang("English");
    }
    /* Beat the clock teaser */
    var clock = document.querySelector("[data-clock]");
    if (clock && !calm) {
      var FL = JSON.parse(clock.getAttribute("data-clock")), ring = clock.querySelector("[data-ring]"), secs = clock.querySelector("[data-secs]"), flash = clock.querySelector("[data-flash]"), t = 60, fi = 0;
      setInterval(function () { t = t <= 0 ? 60 : t - 1; secs.textContent = t; ring.style.strokeDashoffset = (345.6 * (1 - t / 60)).toFixed(1); }, 1000);
      setInterval(function () { fi++; flash.textContent = FL[fi % FL.length]; flash.style.animation = "none"; void flash.offsetWidth; flash.style.animation = ""; }, 2600);
    }
    /* Choice quiz (exercises, quizzes, reading questions, the false friends game) */
    [].forEach.call(document.querySelectorAll("[data-rs-quiz]"), function (box) {
      var D = JSON.parse(box.querySelector(".rs-quiz-data").textContent), QS = D.q.slice(), list = box.querySelector(".rs-qs"), bar = box.querySelector(".ar-qbar i"), ok = 0, k = 0;
      var show = function () {
        bar.style.width = (k / QS.length * 100) + "%"; list.innerHTML = "";
        if (k >= QS.length) {
          var s = el("div", "ar-score"); s.appendChild(el("p", "bm-d", D.score.replace("{n}", ok).replace("{t}", QS.length))); s.appendChild(el("p", "", D.scoreText));
          var row = el("div", "rs-btns"); row.style.justifyContent = "center";
          var j = el("a", "bm-btn", D.join); j.href = D.joinHref; row.appendChild(j);
          var a = el("button", "bm-btn is-ghost", D.again); a.type = "button"; a.addEventListener("click", function () { ok = 0; k = 0; show(); }); row.appendChild(a);
          s.appendChild(row); list.appendChild(s); if (ok >= QS.length * .7) burst(s); return;
        }
        var q = QS[k], order = q[1].map(function (_, i) { return i; });
        if (D.shuffle) order.sort(function () { return Math.random() - .5; });
        var wrap = el("div", "ar-q"), opts = el("div", "ar-opts"), why = el("p", "ar-qwhy"); why.setAttribute("aria-live", "polite");
        wrap.appendChild(el("p", "", q[0]));
        order.forEach(function (i) {
          var b = el("button", "ar-opt", q[1][i]); b.type = "button"; b.setAttribute("data-i", i);
          b.addEventListener("click", function () {
            if (opts.getAttribute("data-done")) return; opts.setAttribute("data-done", "1");
            if (i === q[2]) { ok++; burst(b); } else b.classList.add("is-wrong");
            opts.querySelector('[data-i="' + q[2] + '"]').classList.add("is-right");
            why.textContent = (i === q[2] ? D.ok : D.no) + " " + q[3];
            setTimeout(function () { k++; show(); }, 2000);
          });
          opts.appendChild(b);
        });
        wrap.appendChild(opts); wrap.appendChild(why); list.appendChild(wrap);
      };
      show();
    });
    /* Buddy quiz, with sharing */
    [].forEach.call(document.querySelectorAll("[data-bq]"), function (box) {
      var D = JSON.parse(box.querySelector(".rs-bq-data").textContent), qi = 0, votes = {};
      var run = function () {
        [].slice.call(box.children).forEach(function (c) { if (!c.classList.contains("rs-bq-data")) c.remove(); });
        if (qi >= D.q.length) {
          var best = Object.keys(votes).sort(function (a, b) { return votes[b] - votes[a]; })[0], r = D.res[best];
          var res = el("div", "rs-res"), pic = el("div"); pic.innerHTML = window.AlimunCast ? window.AlimunCast.drawing(best) : "";
          res.appendChild(pic); res.appendChild(el("p", "bm-d", D.youAre.replace("{}", r[0]))); res.appendChild(el("p", "", r[1]));
          var row = el("div", "rs-btns"), note = el("p", "rs-shared"); note.setAttribute("aria-live", "polite");
          var sh = el("button", "bm-btn", D.share); sh.type = "button";
          sh.addEventListener("click", function () {
            var text = D.youAre.replace("{}", r[0]) + ". " + r[1];
            if (navigator.share) navigator.share({ title: text, text: text, url: D.url }).catch(function () {});
            else if (navigator.clipboard) navigator.clipboard.writeText(text + " " + D.url).then(function () { note.textContent = D.copied; });
          });
          var j = el("a", "bm-btn is-ghost", D.join); j.href = D.joinHref;
          var a = el("button", "bm-btn is-ghost", D.again); a.type = "button"; a.addEventListener("click", function () { qi = 0; votes = {}; run(); });
          row.appendChild(sh); row.appendChild(j); row.appendChild(a); res.appendChild(row); res.appendChild(note); box.appendChild(res); burst(box); return;
        }
        var q = D.q[qi], p = el("p", "q", q[0]), opts = el("div", "opts");
        q[1].forEach(function (o) { var b = el("button", "", o[0]); b.type = "button"; b.addEventListener("click", function () { votes[o[1]] = (votes[o[1]] || 0) + 1; qi++; run(); }); opts.appendChild(b); });
        var wrap = el("div"); wrap.style.animation = "bmUp .5s cubic-bezier(.2,.8,.2,1)"; wrap.appendChild(p); wrap.appendChild(opts); box.appendChild(wrap);
      };
      run();
    });
    /* Reading: listen with the browser's voice, paragraph by paragraph */
    var lb = document.querySelector("[data-listen]");
    if (lb) {
      if (!("speechSynthesis" in window)) lb.remove();
      else {
        var label = lb.textContent, playing = false, paras = [].slice.call(document.querySelectorAll("[data-read-text] p"));
        lb.addEventListener("click", function () {
          if (playing) { speechSynthesis.cancel(); playing = false; lb.textContent = label; paras.forEach(function (p) { p.classList.remove("is-reading"); }); return; }
          playing = true; lb.textContent = lb.getAttribute("data-stop"); speechSynthesis.cancel();
          paras.forEach(function (p, i) {
            var u = new SpeechSynthesisUtterance(p.textContent); u.lang = lb.getAttribute("data-lang"); u.rate = .92;
            u.onstart = function () { paras.forEach(function (x) { x.classList.remove("is-reading"); }); p.classList.add("is-reading"); };
            if (i === paras.length - 1) u.onend = function () { playing = false; lb.textContent = label; p.classList.remove("is-reading"); };
            speechSynthesis.speak(u);

        });
      }
    }
    /* Printables: copy the sheet (with its title) into #rs-print before printing; the PDF script calls the same */
    var sheet = document.querySelector(".rs-sheetpage");
    window.rsPreparePrint = function () {
      if (!sheet) return;
      var box = document.getElementById("rs-print") || document.body.appendChild(el("div"));
      box.id = "rs-print"; box.innerHTML = "";
      var t = document.querySelector(".rs-top h1"); if (t) box.appendChild(el("p", "rs-ptitle", t.textContent));
      box.appendChild(sheet.cloneNode(true)); document.body.classList.add("rs-printing");
    };
    window.addEventListener("beforeprint", window.rsPreparePrint);
    window.addEventListener("afterprint", function () { document.body.classList.remove("rs-printing"); });
    var pr = document.querySelector("[data-print]"); if (pr) pr.addEventListener("click", function () { window.rsPreparePrint(); window.print(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
