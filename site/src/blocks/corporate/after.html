
  <!-- Compact B2B Contact Modal Overlay (Popup form) -->
  <div id="corporate-contact-modal" style="display: none; position: fixed; inset: 0; background: rgba(8,8,8,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 99999; align-items: center; justify-content: center; padding: 2rem;">
    <div style="background: #ffffff; border: 1px solid rgba(0,0,0,0.08); border-radius: 1.5rem; max-width: 480px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.15); position: relative; display: flex; flex-direction: column; overflow: hidden; animation: fadeIn 0.3s ease;">
      
      <!-- Modal Header -->
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 2rem; border-bottom: 1px solid rgba(0,0,0,0.06);">
        <h3 style="font-family: 'Anton', sans-serif; font-size: 1.5rem; text-transform: uppercase; margin: 0; color: #080808;" data-i18n="corporate_form_title">Request a demo</h3>
        <button onclick="closeCorporateModal(event)" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #080808; opacity: 0.5; padding: 0.2rem; line-height: 1; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.5">×</button>
      </div>
      
      <!-- Modal Body / Form -->
      <div style="padding: 2rem;">
        <form id="corporate-modal-form" onsubmit="handleCorporateModalSubmit(event)" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div style="display: flex; flex-direction: column; gap: 0.4rem;">
            <label for="modal-name" style="font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(8, 8, 8, 0.6);" data-i18n="corporate_form_name">Full name</label>
            <input type="text" id="modal-name" required placeholder="Full Name" style="background: #fafaf8; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 0.75rem; padding: 0.75rem 1rem; font-family: 'Satoshi', sans-serif; font-size: 0.9rem; color: #080808; outline: none;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.4rem;">
            <label for="modal-email" style="font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(8, 8, 8, 0.6);" data-i18n="corporate_form_email">Corporate email</label>
            <input type="email" id="modal-email" required placeholder="email@company.com" style="background: #fafaf8; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 0.75rem; padding: 0.75rem 1rem; font-family: 'Satoshi', sans-serif; font-size: 0.9rem; color: #080808; outline: none;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.4rem;">
            <label for="modal-message" style="font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(8, 8, 8, 0.6);" data-i18n="corporate_form_message">Message</label>
            <textarea id="modal-message" required placeholder="Tell us about your team's goals..." style="background: #fafaf8; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 0.75rem; padding: 0.75rem 1rem; font-family: 'Satoshi', sans-serif; font-size: 0.9rem; color: #080808; outline: none; min-height: 90px; resize: none;"></textarea>
          </div>
          <button type="submit" class="b2b-btn" style="margin-top: 0.5rem; width: 100%;" id="modal-submit-btn">
            <span data-i18n="corporate_form_submit">Submit request →</span>
          </button>
        </form>
        
        <div id="modal-success-msg" style="display: none; text-align: center; color: #2e6206; padding: 1rem 0;">
          <div style="width: 48px; height: 48px; border-radius: 50%; background: #ceff65; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
            <svg style="width: 20px; height: 20px; stroke: #080808; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <h3 style="font-family: 'Anton', sans-serif; font-size: 1.35rem; text-transform: uppercase; margin-bottom: 0.5rem;">Request Sent</h3>
          <p style="font-size: 0.84rem; line-height: 1.5; color: rgba(8,8,8,0.7);">Our B2B team will email you back within 24 hours to schedule your corporate language readiness demonstration.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=68d948d03b6c9f2bbbac3e5b" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="js/subscribe.js" defer></script>
  <script src="js/webflow.js" type="text/javascript"></script>
  <script src="js/cookies-banner.js" type="text/javascript"></script>

  <script>
    // --- 1. STAGGERED SCROLL-DRIVEN SLIDE-IN ANIMATION ---
    const observerOptions = {
      root: null,
      rootMargin: "0px 0px -60px 0px",
      threshold: 0.05
    };

    const scrollObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    document.querySelectorAll('.animate-on-scroll').forEach((el) => {
      scrollObserver.observe(el);
    });

    // --- 2. KINETIC PUBLICITY SLIDER LOGIC ---
    let activeSlideIndex = 0;
    const totalSlides = 7;
    let slideInterval = setInterval(rotatePublicitySlides, 4500);

    function rotatePublicitySlides() {
      const currentSlide = document.getElementById('slide-' + activeSlideIndex);
      if (currentSlide) {
        currentSlide.classList.remove('is-active');
      }
      activeSlideIndex = (activeSlideIndex + 1) % totalSlides;
      const nextSlide = document.getElementById('slide-' + activeSlideIndex);
      if (nextSlide) {
        nextSlide.classList.add('is-active');
      }
    }

    // --- 2B. HUGE BLACK KINETIC PUBLICITY SLIDER LOGIC ---
    let activeHugeIndex = 0;
    const totalHugeSlides = 7;
    let hugeSlideInterval = setInterval(rotateHugePublicitySlides, 4500);

    function rotateHugePublicitySlides() {
      const currentHugeSlide = document.getElementById('huge-slide-' + activeHugeIndex);
      if (currentHugeSlide) {
        currentHugeSlide.classList.remove('is-active');
      }
      activeHugeIndex = (activeHugeIndex + 1) % totalHugeSlides;
      const nextHugeSlide = document.getElementById('huge-slide-' + activeHugeIndex);
      if (nextHugeSlide) {
        nextHugeSlide.classList.add('is-active');
      }
    }

    // --- 3. MODAL DISPLAY CONTROLS ---
    function openCorporateModal(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const modal = document.getElementById('corporate-contact-modal');
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden'; // Lock background scroll
    }

    function closeCorporateModal(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const modal = document.getElementById('corporate-contact-modal');
      modal.style.display = 'none';
      document.body.style.overflow = ''; // Unlock background scroll
      
      // Reset form view in case it was success
      document.getElementById('corporate-modal-form').style.display = 'flex';
      document.getElementById('modal-success-msg').style.display = 'none';
      document.getElementById('modal-submit-btn').disabled = false;
      document.getElementById('modal-submit-btn').querySelector('span').textContent = 'Submit request →';
    }

    // Close modal on escape key or clicking outer backdrop
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeCorporateModal();
      }
    });
    
    document.getElementById('corporate-contact-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeCorporateModal();
      }
    });

    // --- 4. B2B MODAL SUBMISSION HANDLER ---
    function handleCorporateModalSubmit(e) {
      e.preventDefault();
      
      const form = document.getElementById('corporate-modal-form');
      const success = document.getElementById('modal-success-msg');
      const name = document.getElementById('modal-name').value;
      const email = document.getElementById('modal-email').value;
      const message = document.getElementById('modal-message').value;

      // Basic corporate validation
      const domain = email.split('@')[1] || '';
      const freeDomains = ['gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com', 'aol.com', 'icloud.com'];
      if (freeDomains.includes(domain.toLowerCase())) {
        alert('Please use a corporate email address (not ' + domain + ') to request a B2B demonstration.');
        return;
      }
      
      const submitBtn = document.getElementById('modal-submit-btn');
      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Submitting...';

      setTimeout(() => {
        form.style.display = 'none';
        success.style.display = 'block';
        
        console.log('B2B Corporate Request submitted to corporate@alimun.com:');
        console.log({ name, email, message });
      }, 1000);
    }

    // Re-check localized content when language switcher is toggled
    window.addEventListener('click', function(e) {
      if (e.target.closest('.alimun-i18n-item') || e.target.closest('.alimun-i18n-btn')) {
        setTimeout(() => {
          if (window.i18nTranslatePage) {
            window.i18nTranslatePage();
          }
        }, 150);
      }
    });
  </script>
