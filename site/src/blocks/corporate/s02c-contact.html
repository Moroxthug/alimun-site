      <section class="section corp-cta">
        <style>
          .corp-cta { padding: 2rem 0 0; }
          .corp-cta_card { background-color: var(--green); color: var(--black); border-radius: 3.125rem; padding: 5rem 4rem; display: grid; grid-template-columns: 7fr 5fr; gap: 3rem; align-items: end; overflow: hidden; transform: scale(var(--cta-s, .9)); transform-origin: center bottom; }
          .corp-cta_title { margin: 0; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-weight: 400; line-height: .95; font-size: clamp(3rem, 7vw, 6.5rem); }
          .corp-cta_title span { display: block; transform: translateX(calc(var(--cta-p, 1) * -6% + 6%)); }
          .corp-cta_title span + span { transform: translateX(calc(var(--cta-p, 1) * 6% - 6%)); }
          .corp-cta_side p { margin: 0; }
          .corp-cta .button { margin-top: 1.75rem; width: fit-content; }
          .corp-cta .button.is-secondary { border-color: var(--black); }
          @media (max-width: 767px) { .corp-cta_card { grid-template-columns: 1fr; padding: 3rem 1.75rem; border-radius: 2.25rem; gap: 1.5rem; } }
          @media (prefers-reduced-motion: reduce) { .corp-cta_card { transform: none; } .corp-cta_title span, .corp-cta_title span + span { transform: none; } }
        </style>
        <div class="container-large">
          <div class="corp-cta_card">
            <h2 class="corp-cta_title"><span data-i18n="corp_cta_title_1">Let's talk</span><span data-i18n="corp_cta_title_2">about your team</span></h2>
            <div class="corp-cta_side">
              <p class="text-size-large" data-i18n="corp_price_desc">Pricing depends on the size of your team and what you need. Get in touch and we will put together a quote.</p>
              <a href="contact.html" class="button is-secondary w-inline-block"><p data-i18n="corp_contact_btn">Contact us</p><img src="images/icon-arrow-light.svg" loading="lazy" alt="" class="icon-16"></a>
            </div>
          </div>
        </div>
        <script>
          // The card grows into place and the two heading lines slide together as the section scrolls in.
          (function () {
            var root = document.currentScript.closest(".corp-cta"), card = root.querySelector(".corp-cta_card");
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            function update() {
              var r = root.getBoundingClientRect(), vh = window.innerHeight;
              var p = Math.min(1, Math.max(0, (vh - r.top) / (vh * 0.75)));
              card.style.setProperty("--cta-s", (0.9 + p * 0.1).toFixed(3));
              card.style.setProperty("--cta-p", p.toFixed(3));
            }
            window.addEventListener("scroll", update, { passive: true });
            window.addEventListener("resize", update);
            update();
          })();
        </script>
      </section>
