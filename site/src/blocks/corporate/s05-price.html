      <section class="section price-cta">
        <style>
          .price-cta { padding: 7.5rem 0 5rem; }
          .price-cta_card { background-color: var(--black); color: var(--white); border-radius: 3.125rem; padding: 5.5rem 3rem; display: flex; flex-direction: column; align-items: center; text-align: center; opacity: 0; transform: translateY(2rem) scale(.97); transition: opacity .8s ease, transform .9s cubic-bezier(.215, .61, .355, 1); }
          .price-cta_card.is-in { opacity: 1; transform: none; }
          .price-cta_card p { margin: 0; max-width: 46rem; }
          .price-cta .button { margin-top: 2.25rem; width: fit-content; }
          @media (max-width: 767px) { .price-cta { padding: 5rem 0 3rem; } .price-cta_card { padding: 3.5rem 1.5rem; border-radius: 2.25rem; } }
          @media (prefers-reduced-motion: reduce) { .price-cta_card { opacity: 1; transform: none; transition: none; } }
        </style>
        <div class="container-large">
          <div class="price-cta_card">
            <p class="heading-style-h3" data-i18n="corp_price_desc">Pricing depends on the size of your team and what you need. Get in touch and we will put together a quote.</p>
            <a href="contact.html" class="button w-inline-block"><p data-i18n="corp_contact_btn">Contact us</p><img src="images/icon-arrow-light.svg" loading="lazy" alt="" class="icon-16"></a>
          </div>
        </div>
        <script>
          // The banner fades up once when it comes into view.
          (function () {
            var card = document.currentScript.closest(".price-cta").querySelector(".price-cta_card");
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) { card.classList.add("is-in"); return; }
            var io = new IntersectionObserver(function (e) { if (e[0].isIntersecting) { card.classList.add("is-in"); io.disconnect(); } }, { threshold: 0.2 });
            io.observe(card);
          })();
        </script>
      </section>
