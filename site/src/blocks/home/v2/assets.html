<style>
  /* Homepage additions (owner, 28 Oct 2026: "apply it", from mockup D): today's homepage with the dashboard brought in as touches: the
     cast appearing at chosen moments, things to try, the AI tutor in the homepage's own layout (named as AI on the
     owner's permission). Text comes from data-i18n keys (home2_*); lines the scripts type are read from [data-dk-i18n]. */
  :root { --tu-ease: cubic-bezier(.16, 1, .3, 1); }
  /* Speech bubble, as in the dashboard */
  .dk-bub { position: absolute; padding: .7rem 1rem; background: #fff; border: 3px solid #1a443c; color: #1a443c; font: 600 .95rem/1.3 Satoshi, sans-serif; border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; white-space: nowrap; min-height: 1.3em; transform-origin: 85% 110%; animation: dkBub .6s 1.8s var(--tu-ease) both; z-index: 5; }
  .dk-char { position: absolute; z-index: 5; pointer-events: none; }
  .dk-char svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 18px rgba(8, 8, 8, .18)); }
  /* Hero: the owl joins the video */
  .video_box { position: relative; }
  .dk-hero { right: 3%; bottom: -3%; width: 19%; aspect-ratio: 1; height: auto; animation: dkPeek 1s 1.4s var(--tu-ease) both; }
  .dk-hero-bub { right: 17%; bottom: 17%; font-size: clamp(.8rem, 1.5vw, 1.35rem); padding: .6em 1em; }
  /* Group panels: a buddy peeks out of each photo; the number counts up */
  .gs_img { position: relative; }
  .dk-gs { right: 1.5rem; bottom: -.6rem; width: 7.5rem; height: 7.5rem; transform: translateY(40%) scale(.6); opacity: 0; transition: transform .9s var(--tu-ease), opacity .5s; }
  .gs_panel.dk-in .dk-gs { transform: none; opacity: 1; }
  /* Languages: each language's buddy pops up beside the title when its row lights up */
  .ln_link { position: relative; }
  .dk-food { display: inline-block; width: clamp(3.5rem, 5vw, 5.5rem); height: clamp(3.5rem, 5vw, 5.5rem); margin-left: .75rem; vertical-align: -.35em; opacity: 0; transform: translateY(30%) scale(.4) rotate(-14deg); transition: opacity .4s, transform .8s cubic-bezier(.3, 1.5, .5, 1); }
  .dk-food svg { width: 100%; height: 100%; }
  .ln_row.is-on .dk-food { opacity: 1; transform: none; }
  /* FAQ: the parrot by the heading */
  .qa_head { position: relative; }
  .dk-faq { right: 0; top: -1rem; width: 8rem; height: 8rem; opacity: 0; transform: translateY(20px) scale(.8); transition: opacity .6s, transform .9s var(--tu-ease); }
  .qa_head.dk-in .dk-faq { opacity: 1; transform: none; }
  /* Banner: the buddies peek up from the bottom edge */
  .section.is-bottom-cta { position: relative; overflow: hidden; }
  .dk-line { position: absolute; left: 50%; bottom: -1.2rem; transform: translateX(-50%); display: flex; gap: clamp(.5rem, 2vw, 2rem); z-index: 6; pointer-events: none; }
  .dk-line > div { width: clamp(3.5rem, 7vw, 6.5rem); height: clamp(3.5rem, 7vw, 6.5rem); transform: translateY(110%); transition: transform .9s cubic-bezier(.3, 1.4, .5, 1); }
  .dk-line.dk-in > div { transform: translateY(0); }
  .dk-line > div svg { width: 100%; height: 100%; }

  /* AI tutor section: the homepage's own layout (heading and rows on the left, a large rounded frame on the right) */
  .tu { padding: 8rem 0; background-color: var(--white, #fff); }
  .tu_grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
  .tu_text { display: flex; flex-direction: column; gap: 1.5rem; }
  .tu_text h2 { margin: 0; }
  .tu_lead { margin: 0; max-width: 34rem; color: rgba(8, 8, 8, .7); }
  .tu_mark { background-image: linear-gradient(var(--green, #ceff65), var(--green, #ceff65)); background-repeat: no-repeat; background-position: 0 88%; background-size: 0% 45%; transition: background-size 1s .5s var(--tu-ease); }
  .tu.is-in .tu_mark { background-size: 100% 45%; }
  .tu_rows { border-top: 1px solid rgba(8, 8, 8, .12); }
  .tu_row { padding: 1.25rem 0; border-bottom: 1px solid rgba(8, 8, 8, .12); }
  .tu_row p { margin: 0; max-width: 34rem; color: rgba(8, 8, 8, .7); }
  .tu_row .tu_h { font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: 1.6rem; line-height: 1.05; color: #080808; margin-bottom: .4rem; }
  .tu_rise { opacity: 0; transform: translateY(2.5rem); transition: opacity .8s ease, transform .9s cubic-bezier(.215, .61, .355, 1); }
  .tu.is-in .tu_rise { opacity: 1; transform: none; }
  .tu.is-in .tu_rise:nth-child(2) { transition-delay: .1s; } .tu.is-in .tu_rows .tu_rise:nth-child(1) { transition-delay: .2s; } .tu.is-in .tu_rows .tu_rise:nth-child(2) { transition-delay: .3s; } .tu.is-in .tu_rows .tu_rise:nth-child(3) { transition-delay: .4s; } .tu.is-in .tu_text > .tu_rise:last-child { transition-delay: .5s; }
  .tu_stage { position: relative; height: 72vh; min-height: 34rem; border-radius: 3.125rem; background-color: #f0efe9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem; clip-path: inset(100% 0 0 0 round 3.125rem); transition: clip-path 1.2s cubic-bezier(.77, 0, .175, 1); }
  .tu.is-in .tu_stage { clip-path: inset(0 0 0 0 round 3.125rem); }
  .tu_face { width: clamp(9rem, 14vw, 13rem); height: clamp(9rem, 14vw, 13rem); border-radius: 50%; background: #eaf6f2; display: grid; place-items: center; overflow: hidden; position: relative; transition: box-shadow .3s; }
  .tu_face svg { width: 92%; height: 92%; }
  .tu_stage.is-talk .tu_face { box-shadow: 0 0 0 .5rem rgba(206, 255, 101, .9); animation: tuRing 1.2s ease-in-out infinite; }
  .tu_name { margin: 1.25rem 0 0; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: 1.6rem; }
  .tu_name span { font-family: Satoshi, sans-serif; text-transform: none; font-size: 1rem; color: rgba(8, 8, 8, .55); margin-left: .35rem; }
  .tu_wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 2.2rem; margin: .75rem 0 1.5rem; }
  .tu_wave i { width: 4px; height: 4px; border-radius: 4px; background: #1a443c; opacity: .25; transition: height .1s, opacity .3s; }
  .tu_stage.is-listen .tu_wave i { opacity: 1; }
  .tu_ask { margin: 0 0 .75rem; color: rgba(8, 8, 8, .6); min-height: 1.5em; transition: opacity .4s; }
  .tu_say { margin: 0; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: clamp(2rem, 3.4vw, 3.4rem); line-height: 1.1; }
  .tu_say span { position: relative; display: inline-block; color: rgba(8, 8, 8, .3); transition: color .4s; }
  .tu_say span.ok { color: #080808; }
  .tu_say span.ok::after, .tu_say span.off::after { content: ""; position: absolute; left: 0; right: 0; bottom: .02em; height: .14em; border-radius: .1em; transform-origin: 0 50%; animation: tuLine .5s var(--tu-ease) both; z-index: -1; }
  .tu_say span.ok::after { background: #ceff65; }
  .tu_say span.off { color: #b8513a; }
  .tu_say span.off::after { background: #ff9f8a; }
  .tu_slow { margin: 1.5rem 0 0; min-height: 2.6rem; display: flex; gap: .9rem; align-items: center; justify-content: center; flex-wrap: wrap; opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .6s var(--tu-ease); }
  .tu_slow.is-on { opacity: 1; transform: none; }
  .tu_slow b { font: 400 1.5rem Coolvetica Condensed, sans-serif; text-transform: uppercase; letter-spacing: .16em; background: #fff; border-radius: 5rem; padding: .35rem 1.1rem; color: #1a443c; white-space: nowrap; }
  .tu_slow span { color: rgba(8, 8, 8, .65); }

  /* Try it: inside "Practice between classes" */
  .tr { margin-top: 1.75rem; max-width: 40rem; background: #f0efe9; border-radius: 1.75rem; padding: 1.5rem; }
  .tr_q { margin: 0 0 1rem; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: 1.75rem; line-height: 1.05; }
  .tr_opts { display: flex; gap: .6rem; }
  .tr_opts button { flex: 1; height: 3.25rem; border-radius: 1rem; border: 2px solid transparent; background: #fff; font: 700 1.05rem Satoshi, sans-serif; cursor: pointer; transition: transform .25s, border-color .25s, background .25s; }
  .tr_opts button:hover { transform: translateY(-2px); border-color: #1a443c; }
  .tr_opts button.is-right { background: #ceff65; border-color: #1a443c; animation: trPop .5s; }
  .tr_opts button.is-wrong { background: #fdeee9; border-color: #ff9f8a; animation: trShake .4s; }
  .tr_why { margin: .8rem 0 0; font-size: .95rem; color: #1a443c; min-height: 1.4em; }
  .tr_cards { display: flex; gap: .6rem; margin-top: 1rem; }
  .tr_fc { flex: 1; position: relative; height: 5.25rem; border: 0; padding: 0; background: none; cursor: pointer; perspective: 800px; }
  .tr_fc span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: .5rem; border-radius: 1rem; backface-visibility: hidden; transition: transform .6s var(--tu-ease); }
  .tr_fc .f { background: #fff; font: 400 1.4rem Coolvetica Condensed, sans-serif; text-transform: uppercase; }
  .tr_fc .b { background: #ceff65; font: 700 .85rem/1.3 Satoshi, sans-serif; transform: rotateY(180deg); }
  .tr_fc.is-flip .f { transform: rotateY(-180deg); } .tr_fc.is-flip .b { transform: rotateY(0); }
  .dk-burst { position: fixed; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; z-index: 2000; animation: dkBurst .8s cubic-bezier(.2, .8, .2, 1) forwards; }

  /* The cast's own motion (as in the dashboard) */
  .tutor-art .mo { display: none; }
  .tutor-art[data-mouth="rest"] .mo-rest, .tutor-art:not([data-mouth]) .mo-rest, .tutor-art[data-mouth="m"] .mo-m, .tutor-art[data-mouth="e"] .mo-e, .tutor-art[data-mouth="a"] .mo-a, .tutor-art[data-mouth="o"] .mo-o { display: inline; }
  .tutor-art .blink { animation: dkBlink 4.2s infinite; transform-box: fill-box; transform-origin: center; }
  .sway { animation: dkSway 3s ease-in-out infinite; transform-origin: 50% 95%; } .bob { animation: dkBob 1.8s ease-in-out infinite; } .float { animation: dkBob 3.2s ease-in-out infinite; }
  .breathe { animation: dkBreathe 3s ease-in-out infinite; transform-origin: 50% 100%; } .look { animation: dkLook 4s ease-in-out infinite; } .crawl { animation: dkCrawl 6s ease-in-out infinite; }
  .wag .tail { animation: dkWag .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0 100%; }
  @keyframes dkBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes dkSway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes dkBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes dkBreathe { 50% { transform: scaleY(.96); } } @keyframes dkLook { 0%, 40%, 100% { transform: translateX(0); } 50%, 85% { transform: translateX(3px); } }
  @keyframes dkCrawl { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } } @keyframes dkWag { to { transform: rotate(12deg); } }
  @keyframes dkPeek { from { opacity: 0; transform: translateY(60%) rotate(-10deg); } to { opacity: 1; transform: none; } }
  @keyframes dkBub { from { opacity: 0; transform: scale(.5) rotate(-6deg); } to { opacity: 1; transform: none; } }
  @keyframes tuRing { 50% { box-shadow: 0 0 0 .9rem rgba(206, 255, 101, .45); } }
  @keyframes tuLine { from { transform: scaleX(0); } }
  @keyframes trPop { 40% { transform: scale(1.06); } } @keyframes trShake { 25% { transform: translateX(-6px); } 75% { transform: translateX(5px); } }
  @keyframes dkBurst { from { transform: translate(0, 0) scale(1); opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(.3); opacity: 0; } }

  /* More colour (owner, 27 Oct 2026: "add a bit more colour and animations") */
  .gs_panel:nth-child(4n+1) { background-color: #eaf6f2; } .gs_panel:nth-child(4n+2) { background-color: #fff4e0; } .gs_panel:nth-child(4n+3) { background-color: #fdeee9; } .gs_panel:nth-child(4n+4) { background-color: #f4fbe0; }
  .qa_card { background-color: #f4fbe0 !important; }
  .qa_card::after { content: ""; position: absolute; right: -4rem; bottom: -4rem; width: 14rem; height: 14rem; border-radius: 50%; background: radial-gradient(circle, rgba(206, 255, 101, .7), rgba(206, 255, 101, 0) 70%); animation: dkDrift 8s ease-in-out infinite alternate; pointer-events: none; }
  .tu_stage { background-color: #fff4e0 !important; overflow: hidden; }
  .tu_stage::before, .tu_stage::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; animation: dkDrift 9s ease-in-out infinite alternate; }
  .tu_stage::before { width: 22rem; height: 22rem; left: -7rem; top: -7rem; background: radial-gradient(circle, rgba(159, 214, 199, .55), rgba(159, 214, 199, 0) 70%); }
  .tu_stage::after { width: 20rem; height: 20rem; right: -6rem; bottom: -6rem; background: radial-gradient(circle, rgba(255, 159, 138, .4), rgba(255, 159, 138, 0) 70%); animation-delay: -4s; }
  .tu_stage > * { position: relative; z-index: 1; }
  /* Section headings: a lime marker sweeps under the last words as they arrive */
  .dk-hl { background-image: linear-gradient(#ceff65, #ceff65); background-repeat: no-repeat; background-position: 0 88%; background-size: 0% 42%; transition: background-size 1s .3s cubic-bezier(.215, .61, .355, 1); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .dk-hl.is-in { background-size: 100% 42%; }
  /* Learn rows: a buddy in a tinted circle beside each title */
  .dk-ico { display: inline-grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 50%; margin-right: .9rem; vertical-align: middle; transform: scale(.4) rotate(-20deg); opacity: 0; transition: transform .8s cubic-bezier(.3, 1.5, .5, 1) .2s, opacity .4s .2s; }
  .dk-ico svg { width: 2.9rem; height: 2.9rem; }
  .sx_row.is-in .dk-ico { transform: none; opacity: 1; }
  .sx_row h3 { display: flex; align-items: center; }

  /* Product videos: a large rounded frame that opens and grows with the scroll, a pulsing play button */
  .pv { position: relative; z-index: 2; padding: 7rem 0 2rem; background-color: #fff; }
  .pv_head { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: end; margin-bottom: 2.5rem; }
  .pv_head h2 { margin: 0; } .pv_lead { margin: 0; max-width: 34rem; color: rgba(8, 8, 8, .7); }
  .pv_rise { opacity: 0; transform: translateY(2.5rem); transition: opacity .8s ease, transform .9s cubic-bezier(.215, .61, .355, 1); }
  .pv.is-in .pv_rise { opacity: 1; transform: none; } .pv.is-in .pv_rise + .pv_rise { transition-delay: .12s; }
  .pv_frame { position: relative; aspect-ratio: 16 / 9; max-height: 82vh; width: 100%; border-radius: 3.125rem; overflow: hidden; background: #f0efe9; transform: scale(var(--pv-s, .86)); clip-path: inset(0 0 0 0 round 3.125rem); box-shadow: 0 30px 80px rgba(8, 8, 8, .12); }
  .pv_img { width: 100%; height: 100%; object-fit: cover; transform: scale(calc(1.25 - (var(--pv-s, .86) - .86) * 1.5)); }
  @keyframes pvPulse { 0% { box-shadow: 0 0 0 0 rgba(206, 255, 101, .75); } 100% { box-shadow: 0 0 0 2.2rem rgba(206, 255, 101, 0); } }
  @keyframes dkDrift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-2.5rem, 2rem) scale(1.15); } }
  @media (max-width: 767px) { .pv { padding: 4rem 0 1rem; } .pv_head { grid-template-columns: 1fr; gap: 1rem; } .pv_frame { border-radius: 2.25rem; aspect-ratio: 4 / 5; } .dk-ico { width: 2.75rem; height: 2.75rem; } .dk-ico svg { width: 2.2rem; height: 2.2rem; } }

  /* Moving band of words between the plans and the showcase; it speeds up with the scroll */
  .mq { position: relative; z-index: 2; background: #fff; padding: 3.5rem 0; overflow: hidden; border-top: 1px solid rgba(8, 8, 8, .08); border-bottom: 1px solid rgba(8, 8, 8, .08); }
  .mq_track { display: flex; width: max-content; will-change: transform; }
  .mq_set { display: flex; align-items: center; gap: 2.5rem; padding-right: 2.5rem; }
  .mq_w { font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: clamp(3rem, 7vw, 6.5rem); line-height: 1; white-space: nowrap; color: #080808; }
  .mq_w.is-hl { background: #ceff65; border-radius: 5rem; padding: .05em .4em; }
  .mq_d { width: clamp(3.5rem, 6vw, 5.5rem); height: clamp(3.5rem, 6vw, 5.5rem); flex: none; } .mq_d svg { width: 100%; height: 100%; }

  /* Showcase: rows on the left, a sticky screen on the right that plays the row in the middle of the window */
  .fx { position: relative; z-index: 2; padding: 8rem 0; background: #fff; }
  .fx_head { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: end; margin-bottom: 3rem; }
  .fx_head h2 { margin: 0; } .fx_lead { margin: 0; max-width: 34rem; color: rgba(8, 8, 8, .7); }
  .fx_rise { opacity: 0; transform: translateY(2.5rem); transition: opacity .8s ease, transform .9s cubic-bezier(.215, .61, .355, 1); }
  .fx.is-in .fx_rise { opacity: 1; transform: none; } .fx.is-in .fx_rise + .fx_rise { transition-delay: .12s; }
  .fx_grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 4rem; align-items: start; }
  .fx_row { min-height: 62vh; display: flex; flex-direction: column; justify-content: center; border-top: 1px solid rgba(8, 8, 8, .12); opacity: .28; transition: opacity .6s ease; }
  .fx_row:last-child { border-bottom: 1px solid rgba(8, 8, 8, .12); }
  .fx_row.is-on { opacity: 1; }
  .fx_row .fx_h { margin: 0 0 1rem; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: clamp(2rem, 3vw, 3rem); line-height: 1; background-image: linear-gradient(#ceff65, #ceff65); background-repeat: no-repeat; background-position: 0 88%; background-size: 0% 40%; transition: background-size .9s cubic-bezier(.215, .61, .355, 1); display: inline; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .fx_row.is-on .fx_h { background-size: 100% 40%; }
  .fx_row p:not(.fx_h) { margin: 1rem 0 0; max-width: 32rem; color: rgba(8, 8, 8, .72); line-height: 1.6; }
  .fx_side { position: sticky; top: 14vh; }
  .fx_screen { position: relative; height: 72vh; min-height: 30rem; border-radius: 3.125rem; background: #eaf6f2; overflow: hidden; transition: background-color .8s ease; box-shadow: 0 30px 80px rgba(8, 8, 8, .08); }
  .fx_screen::before { content: ""; position: absolute; width: 26rem; height: 26rem; right: -8rem; top: -8rem; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0) 70%); animation: dkDrift 10s ease-in-out infinite alternate; }
  .fx_sc { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2.5rem; opacity: 0; transform: translateY(40px) scale(.96); transition: opacity .6s ease, transform .8s cubic-bezier(.16, 1, .3, 1); pointer-events: none; }
  .fx_sc.is-on { opacity: 1; transform: none; }
  .fx_app { width: min(26rem, 100%); background: #fff; border-radius: 1.75rem; padding: 1.75rem; box-shadow: 0 24px 60px rgba(8, 8, 8, .12); position: relative; }
  .fx_k { margin: 0 0 .4rem; font-size: .85rem; font-weight: 700; color: rgba(8, 8, 8, .5); }
  .fx_big { margin: 0; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: 2.6rem; line-height: 1; }
  .fx_sm { margin: .4rem 0 0; font-size: .9rem; color: rgba(8, 8, 8, .6); }
  .fx_q { margin: .25rem 0 1rem; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; font-size: 1.7rem; line-height: 1.1; }
  .fx_join { display: inline-block; margin-top: 1.1rem; background: #1a443c; color: #ceff65; font-weight: 700; border-radius: 5rem; padding: .7rem 1.6rem; animation: pvPulse 2.2s ease-out infinite; }
  .fx_cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: .45rem; margin-top: 1.4rem; }
  .fx_cal i { aspect-ratio: 1; border-radius: .6rem; background: #f0efe9; position: relative; }
  .fx_cal i.d::after { content: ""; position: absolute; left: 50%; bottom: 22%; width: .45rem; height: .45rem; margin-left: -.22rem; border-radius: 50%; background: #1a443c; transform: scale(0); transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
  .fx_cal i.h::after { background: #ff9f8a; }
  .fx_sc.is-on .fx_cal i.d::after { transform: scale(1); }
  .fx_sc.is-on .fx_cal i:nth-child(5)::after { transition-delay: .2s; } .fx_sc.is-on .fx_cal i:nth-child(9)::after { transition-delay: .35s; } .fx_sc.is-on .fx_cal i:nth-child(12)::after { transition-delay: .5s; }
  .fx_book { position: relative; width: min(28rem, 100%); aspect-ratio: 1.55; display: grid; grid-template-columns: 1fr 1fr; perspective: 1400px; }
  .fx_page { background: #fff; padding: 1.4rem; box-shadow: 0 20px 50px rgba(8, 8, 8, .12); }
  .fx_page.l { border-radius: 1.4rem 0 0 1.4rem; display: flex; flex-direction: column; gap: .7rem; justify-content: center; }
  .fx_page.l b { display: block; height: .55rem; border-radius: .3rem; background: #f0efe9; width: 0; transition: width .8s ease; }
  .fx_sc.is-on .fx_page.l b { width: 100%; } .fx_sc.is-on .fx_page.l b.s { width: 60%; }
  .fx_sc.is-on .fx_page.l b:nth-child(2) { transition-delay: .15s; } .fx_sc.is-on .fx_page.l b:nth-child(3) { transition-delay: .3s; } .fx_sc.is-on .fx_page.l b:nth-child(4) { transition-delay: .45s; }
  .fx_page.r { border-radius: 0 1.4rem 1.4rem 0; display: flex; flex-direction: column; justify-content: center; gap: .5rem; }
