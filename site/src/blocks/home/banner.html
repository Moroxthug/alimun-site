      <section data-w-id="4500f34f-ad71-c737-340f-a39b6520a855" class="section is-bottom-cta">

              <!-- Typography sequence animation with white background -->
              <style>
                .alimun-cta-adv-container {
                  position: absolute;
                  inset: 0;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background-color: #ffffff;
                  font-family: 'Satoshi', 'Inter', sans-serif;
                  overflow: hidden;
                }
                .alimun-cta-adv-text {
                  font-size: 5vw;
                  font-weight: 800;
                  color: #080808;
                  text-transform: uppercase;
                  letter-spacing: -0.03em;
                  position: absolute;
                  opacity: 0;
                  text-align: center;
                  width: 100%;
                  transform: scale(0.95) translateY(10px);
                  animation: ctaAdvSequence 15s infinite ease-in-out;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 1rem;
                  flex-wrap: wrap;
                  padding: 0 2rem;
                }
                .alimun-cta-highlight {
                  background-color: #ceff65;
                  color: #080808;
                  padding: 0.1em 0.5em;
                  border-radius: 5rem;
                  display: inline-block;
                  box-shadow: 0 4px 15px rgba(206, 255, 101, 0.3);
                }
                
                /* Timings for the four phrases */
                .cta-phrase-1 { animation-delay: 0s; }
                .cta-phrase-2 { animation-delay: 3s; }
                .cta-phrase-3 { animation-delay: 6s; }
                .cta-phrase-4 { animation-delay: 9s; }

                @keyframes ctaAdvSequence {
                  0% {
                    opacity: 0;
                    transform: scale(0.95) translateY(10px);
                  }
                  1.5%, 17% {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                  }
                  18.5%, 100% {
                    opacity: 0;
                    transform: scale(1.02) translateY(-10px);
                  }
                }

                /* Dark Logo screen animation for bottom CTA */
                .alimun-cta-logo-anim {
                  position: absolute;
                  width: 100%;
                  height: 100%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background-color: #ffffff;
                  opacity: 0;
                  transform: scale(0.8);
                  animation: ctaLogoSequence 15s infinite ease-in-out;
                  pointer-events: none;
                }
                
                .alimun-cta-logo-anim img {
                  width: 45vw;
                  max-width: 450px;
                  height: auto;
                }

                @keyframes ctaLogoSequence {
                  0%, 78% {
                    opacity: 0;
                    transform: scale(0.8);
                  }
                  82%, 96% {
                    opacity: 1;
                    transform: scale(1);
                  }
                  98%, 100% {
                    opacity: 0;
                    transform: scale(1.05);
                  }
                }

                /* Subtle background grid effect for CTA */
                .alimun-cta-grid-bg {
                  position: absolute;
                  inset: 0;
                  background-image: 
                    radial-gradient(circle at 1px 1px, rgba(206, 255, 101, 0.3) 1.5px, transparent 0);
                  background-size: 30px 30px;
                  opacity: 0.5;
                  animation: ctaGridFloat 30s infinite linear;
                }
                
                @keyframes ctaGridFloat {
                  from { background-position: 0 0; }
                  to { background-position: 30px 30px; }
                }

                @media (max-width: 768px) {
                  .alimun-cta-adv-text {
                    font-size: 8vw;
                    gap: 0.5rem;
                  }
                  .alimun-cta-logo-anim img {
                    width: 70vw;
                  }
                }
              </style>

              <div class="alimun-cta-adv-container">
                <div class="alimun-cta-grid-bg"></div>
                
                <!-- Word-on-screen publicity phrases -->
                <div class="alimun-cta-adv-text cta-phrase-1" data-i18n-html="cta_phrase_1">Want to <span class="alimun-cta-highlight">move abroad?</span></div>
                <div class="alimun-cta-adv-text cta-phrase-2" data-i18n-html="cta_phrase_2">Want to <span class="alimun-cta-highlight">land that job?</span></div>
                <div class="alimun-cta-adv-text cta-phrase-3" data-i18n-html="cta_phrase_3">Want to <span class="alimun-cta-highlight">pass that exam?</span></div>
                <div class="alimun-cta-adv-text cta-phrase-4" data-i18n-html="cta_phrase_4">Join <span class="alimun-cta-highlight">Alimun.</span></div>
                
                <!-- Final Logo Animation -->
                <div class="alimun-cta-logo-anim">
                  <img src="images/alimun-logo.svg" alt="Alimun Logo">
                </div>
              </div>
            </div>
            <div class="max-width-full">

        <style>

          .is-bottom-cta.lv-bc .bottom-cta_box { will-change: transform; }
          @media (prefers-reduced-motion: reduce) { .is-bottom-cta.lv-bc .bottom-cta_wrap .is-word { opacity: 1; transform: none; transition: none; } }
        </style>
        <script>
          (function () {
            var root = document.currentScript.closest(".is-bottom-cta"), wrap = root.querySelector(".bottom-cta_wrap"), box = root.querySelector(".bottom-cta_box");
            // Webflow's scroll engine leaves this section alone (this runs before webflow.js loads).

            root.classList.add("lv-bc");

            var set = function (k) { box.style.transform = "scale(" + (2.5 - 1.5 * k).toFixed(4) + ")"; box.style.setProperty("--bottom-cta-radius", (3.125 * k).toFixed(3) + "rem"); };
            if (calm || !("IntersectionObserver" in window)) { root.classList.add("is-title"); set(1); return; }
            new IntersectionObserver(function (l, o) { if (l[0].isIntersecting) { root.classList.add("is-title"); o.disconnect(); } }, { rootMargin: "0px 0px -15% 0px" }).observe(wrap || root);
            // Progress runs from the section's top at the bottom of the screen (0) to halfway through its passage (1), eased towards like Webflow's smoothing.
            var target = 0, cur = 0, running = false, onScreen = false;
            var measure = function () { var r = root.getBoundingClientRect(), p = (innerHeight - r.top) / (innerHeight + r.height); target = Math.max(0, Math.min(1, p / 0.5)); };
            var tick = function () { cur += (target - cur) * 0.2; if (Math.abs(target - cur) < 0.0005) cur = target; set(cur); if (cur !== target) requestAnimationFrame(tick); else running = false; };
            var kick = function () { if (!onScreen) return; measure(); if (!running && cur !== target) { running = true; requestAnimationFrame(tick); } };
            new IntersectionObserver(function (l) { onScreen = l[0].isIntersecting; kick(); }, { rootMargin: "100px 0px" }).observe(root);
            window.addEventListener("scroll", kick, { passive: true });
            window.addEventListener("resize", kick);
            measure(); cur = target; set(cur);
          })();
        </script>
