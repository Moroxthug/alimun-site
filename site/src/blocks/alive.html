<style>

      $$(".tp_card").forEach(function (c, i) { peek($(".tp_img", c), buds[i % 4], "lv-card-char"); });
      var pc = $(".pc_card"), pcn = $(".pc_num");

      /* Services: a buddy in a tinted circle beside each tool and each step; photos open as they arrive */
      var toolDraw = ["owl", "ghost", "parrot", "monster", "cat", "alien", "dog", "dragon"];
      $$(".tl_item").forEach(function (it, i) { ico($(".tl_text h3", it), toolDraw[i % toolDraw.length], tints[i % 4]); });
      var stepDraw = ["sun", "teacup", "mug", "suitcase", "cactus", "snail"];
      $$(".how_block").forEach(function (bk, i) { ico($("h3", bk), stepDraw[i % stepDraw.length], tints[i % 4]); });
      var fv = $(".feature_visual"); if (fv) { fv.classList.add("lv-open"); seen(fv, function () { fv.classList.add("is-in"); }, { threshold: 0.25 }); }

      /* About */
      var ap = $(".ah_photo"); if (ap) { ap.classList.add("lv-open"); seen(ap, function () { ap.classList.add("is-in"); }, { threshold: 0.25 }); var aw = document.createElement("div"); aw.className = "lv-host"; ap.parentNode.insertBefore(aw, ap); aw.appendChild(ap); peek(aw, "dog", "lv-ah-char"); }
      $$(".paths_card").forEach(function (c, i) { var im = $(".paths_img", c); if (im) { im.classList.add("lv-open"); seen(im, function () { im.classList.add("is-in"); }, { threshold: 0.25 }); var pw = document.createElement("div"); pw.className = "lv-host"; im.parentNode.insertBefore(pw, im); pw.appendChild(im); peek(pw, i ? "parrot" : "cat", "lv-card-char"); } });

      /* Contact */
      var cf = $(".contact_form-block"); if (cf) peek(cf, "dog", "lv-form-char");
      var cv = $(".contact_visual-mask"); if (cv) { cv.classList.add("lv-open"); setTimeout(function () { cv.classList.add("is-in"); }, 250); peek(cv, "teacup", "lv-ct-char"); }
      var crDraw = ["owl", "parrot", "suitcase"];
      $$(".cr_card").forEach(function (c, i) { ico($("h3", c), crDraw[i % 3], "#ffffff"); });

      /* FAQ and banner */
      var qh = $(".qa_head"); if (qh) peek(qh, "parrot", "lv-faq");
      var cta = $(".section.is-bottom-cta");
      if (cta) { var line = document.createElement("div"); line.className = "dk-line"; ["teacup", "pretzel", "churro", "croissant", "pizza", "nata"].forEach(function (f, i) { var d = document.createElement("div"); d.style.transitionDelay = (i * 0.08) + "s"; d.innerHTML = C.drawing(f) || ""; line.appendChild(d); }); cta.appendChild(line); seen(cta, function () { line.classList.add("dk-in"); }); }

      /* More colour and variety */
      var tintsDeep = ["#9fd6c7", "#ffd166", "#ff9f8a", "#ceff65"];
      var stack = function (el, i, host) { if (!el || innerWidth < 768) return; var s = host || el; if (!host) { s = document.createElement("div"); s.className = "lv-stack"; el.parentNode.insertBefore(s, el); s.appendChild(el); } else s.classList.add("lv-stack", "is-host");
        var b = document.createElement("div"); b.className = "lv-back"; b.setAttribute("aria-hidden", "true"); var r = i % 2 ? -3 : 3;
        b.style.background = tints[i % 4]; b.style.setProperty("--br", r + "deg"); b.style.setProperty("--bx", (i % 2 ? -1.25 : 1.25) + "rem"); s.insertBefore(b, s.firstChild); backs.push(b); seen(s, function () { s.classList.add("is-in"); }, { threshold: 0.2 }); };
      var backs = [];
      $$(".tl_img").forEach(function (im, i) { stack(im, i + 1); });
      if ($(".ah_photo")) stack($(".ah_photo").parentNode, 2, $(".ah_photo").parentNode);
      $$(".paths_img").forEach(function (im, i) { var w = im.parentNode; if (w.classList.contains("lv-host")) stack(w, i + 3, w); });
      if (cv) stack(cv, 1);
      /* Palette dots */
      var dots = function (host, n) { if (!host) return; host.classList.add("lv-host"); for (var i = 0; i < n; i++) { var d = document.createElement("i"), s = 10 + Math.random() * 18; d.className = "lv-dot"; d.setAttribute("aria-hidden", "true"); d.style.width = d.style.height = s.toFixed(0) + "px"; d.style.background = tintsDeep[i % 4]; d.style.left = (4 + Math.random() * 90).toFixed(1) + "%"; d.style.top = (Math.random() * 100).toFixed(1) + "%"; d.style.setProperty("--d", (5 + Math.random() * 5).toFixed(1) + "s"); d.style.setProperty("--fx", ((Math.random() - .5) * 40).toFixed(0) + "px"); d.style.setProperty("--fy", ((Math.random() - .5) * 40).toFixed(0) + "px"); d.style.animationDelay = (-Math.random() * 6).toFixed(1) + "s"; host.appendChild(d); } };
      if (!calm) { dots($(".section.is-about-hero"), 7); dots($(".section.is-contact"), 6); dots($(".cr"), 4); }
      /* Entrances that differ per section */
      var enter = function (els, cls, f) { els.forEach(function (e, i) { e.classList.remove("dk-rise"); e.classList.add(cls); if (f) f(e, i); e.style.transitionDelay = (i % 4 * 0.1) + "s"; seen(e, function () { e.classList.add("is-in"); setTimeout(function () { e.style.transitionDelay = ""; e.classList.add("lv-done"); }, 1500 + i % 4 * 100); }, { threshold: 0.15 }); }); };
      enter($$(".tp_card"), "lv-fan", function (e, i) { e.style.setProperty("--fr", ([-5, -2, 2, 5][i % 4]) + "deg"); });
      enter($$(".cr_card"), "lv-pop");
      enter($$(".paths_card"), "lv-side", function (e, i) { e.style.setProperty("--sx", (i % 2 ? 4 : -4) + "rem"); });
      enter($$(".bl-strip .bm-card"), "lv-flip");
      enter($$(".pc_card, .contact_form-block"), "lv-pop");
      /* Back cards drift against the scroll */
      if (!calm && backs.length) { var bq = 0, bTick = function () { bq = 0; var ks = backs.map(function (b) { var r = b.parentNode.getBoundingClientRect(); return r.bottom < -100 || r.top > innerHeight + 100 ? null : Math.max(-1, Math.min(1, (r.top + r.height / 2 - innerHeight / 2) / innerHeight)); }); backs.forEach(function (b, i) { if (ks[i] === null) return; var v = (ks[i] * (i % 2 ? 1 : -1) * (innerWidth < 768 ? 14 : 40)).toFixed(0) + "px"; if (b._p !== v) { b._p = v; b.style.setProperty("--lv-par", v); } }); }; window.addEventListener("scroll", function () { if (!bq) bq = requestAnimationFrame(bTick); }, { passive: true }); bTick(); }
      /* The moving band */
      $$(".mq [data-draw]").forEach(function (el) { el.innerHTML = C.drawing(el.getAttribute("data-draw")) || ""; });
      var mq = $("[data-mq]"), mqDraws = $$(".mq_d");
      if (mq && !calm) { var mx = 0, boost = 0, lastY = scrollY, dir = $(".tl") ? -1 : 1, mqw = mq.firstElementChild.offsetWidth, mqOn = false; if (dir > 0) mx = -mqw; window.addEventListener("resize", function () { mqw = mq.firstElementChild.offsetWidth; });
        /* runs only while the band is on screen, its width measured once */
        var mqLoop = function () { if (!mqOn) return; var y = scrollY; boost = Math.min(18, boost * 0.92 + Math.abs(y - lastY) * 0.06); lastY = y; mx += dir * (0.6 + boost); if (-mx > mqw) mx += mqw; if (mx > 0) mx -= mqw; mq.style.transform = "translate3d(" + mx.toFixed(1) + "px,0,0)"; var rot = (y * 0.08) % 360; mqDraws.forEach(function (d, i) { d.style.setProperty("--mq-r", ((i % 2 ? -1 : 1) * Math.sin(rot / 30) * 14).toFixed(1) + "deg"); }); requestAnimationFrame(mqLoop); };
        if ("IntersectionObserver" in window) new IntersectionObserver(function (l) { var on = l[0].isIntersecting; if (on && !mqOn) { mqOn = true; lastY = scrollY; requestAnimationFrame(mqLoop); } else if (!on) mqOn = false; }).observe(mq.parentNode); else { mqOn = true; mqLoop(); } }

      if (calm) return;
      /* Text, cards and blog rise in */
      $$(".tp_head p, .tp_note, .pc_text, .tl_head p, .tl_text p, .how_block p, .ah_text p, .paths_card h2, .paths_card p, .qa_head p, .contact_content > p, .cr_card p, .bl-strip_head, .ft_top > *, .ft_col").filter(function (e) { return !e.closest(".button, button"); }).forEach(function (e, i) { e.classList.add("dk-rise"); e.style.transitionDelay = ((i % 4) * 0.08) + "s"; seen(e, function () { e.classList.add("is-in"); }, { threshold: 0.15 }); });
      /* Scroll progress */
      var bar = document.createElement("div"); bar.className = "dk-prog"; document.body.appendChild(bar); var pq = 0;
      window.addEventListener("scroll", function () { if (pq) return; pq = requestAnimationFrame(function () { pq = 0; var m = document.documentElement.scrollHeight - innerHeight; bar.style.setProperty("--dk-p", m > 0 ? (scrollY / m).toFixed(4) : 0); }); }, { passive: true });
      /* A burst of colour on every main button click */
      $$(".button, .tp_cta").forEach(function (b) { b.addEventListener("click", function () { burst(b); }); });
      function burst(el) { var r = el.getBoundingClientRect(), cs = ["#ceff65", "#ffd166", "#9fd6c7", "#ff9f8a", "#1a443c"]; for (var i = 0; i < 16; i++) { var d = document.createElement("i"), a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 70; d.className = "dk-burst"; d.style.left = (r.left + r.width / 2) + "px"; d.style.top = (r.top + r.height / 2) + "px"; d.style.background = cs[i % 5]; d.style.setProperty("--x", Math.cos(a) * s + "px"); d.style.setProperty("--y", Math.sin(a) * s + "px"); document.body.appendChild(d); setTimeout(d.remove.bind(d), 850); } }
      /* Desktop: buttons lean to the mouse, cards tilt */
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        $$(".button").forEach(function (b) {
          b.addEventListener("mousemove", function (e) { var r = b.getBoundingClientRect(); b.style.translate = ((e.clientX - r.left - r.width / 2) * 0.18).toFixed(1) + "px " + ((e.clientY - r.top - r.height / 2) * 0.25).toFixed(1) + "px"; });
          b.addEventListener("mouseleave", function () { b.style.translate = ""; });
        });
        $$(".tp_card").forEach(function (pn) {
          pn.addEventListener("mousemove", function (e) { var r = pn.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; pn.style.transform = "perspective(1200px) rotateX(" + (-y * 3).toFixed(2) + "deg) rotateY(" + (x * 3).toFixed(2) + "deg)"; });
          pn.addEventListener("mouseleave", function () { pn.style.transform = ""; });
        });
      }
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
  })();
