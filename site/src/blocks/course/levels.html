      <section class="lv">
        <style>
          /* CEFR levels: the screen holds while a giant level code rolls through a white card with the scroll; its name and description slide in beside it and a lime bar fills across the six levels. */
          .lv { position: relative; height: 520vh; }
          .lv_stage { position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
          .lv_head { margin-bottom: 3rem; }
          .lv_head h2 { margin: 0; }
          .lv_head p { margin: 1rem 0 0; max-width: 40rem; color: rgba(8, 8, 8, .7); }
          .lv_body { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
          .lv_codes, .lv_texts { position: relative; height: clamp(12rem, 34vh, 22rem); }
          .lv_codes { border-radius: 3.125rem; background-color: var(--white); overflow: hidden; }
          .lv_code { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; line-height: .8; font-size: clamp(9rem, 26vh, 18rem); letter-spacing: -.02em; color: var(--black); opacity: 0; transform: translateY(70%); transition: opacity .7s ease, transform .85s cubic-bezier(.215, .61, .355, 1); }
          .lv_text { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; opacity: 0; transform: translateX(3rem); transition: opacity .7s ease, transform .85s cubic-bezier(.215, .61, .355, 1); }
          .lv_text h3 { margin: 0 0 1rem; }
          .lv_text p { margin: 0; max-width: 32rem; }
          .lv_code.is-before { transform: translateY(-70%); }
          .lv_text.is-before { transform: translateX(-3rem); }
          .lv_code.is-on, .lv_text.is-on { opacity: 1; transform: none; }
          .lv_track { position: relative; margin-top: 3rem; height: 4px; border-radius: 5rem; background-color: #0808081a; overflow: hidden; }
          .lv_cta { margin-top: 2rem; display: flex; justify-content: center; }
          .lv_fill { height: 100%; width: calc(var(--lv-p, 0) * 100%); background-color: var(--green); border-radius: 5rem; }
          @media (max-width: 767px) {
            .lv { height: 480vh; }
            .lv_head { margin-bottom: 1.5rem; }
            .lv_head p { font-size: .95rem; }
            .lv_cta { margin-top: 1.25rem; }
            .lv_body { grid-template-columns: 1fr; gap: 1rem; }
            .lv_codes { height: 11rem; border-radius: 2.25rem; }
            .lv_code { font-size: 8.5rem; }
            .lv_texts { height: 14rem; }
            .lv_text { justify-content: flex-start; }
          }
        </style>
        <div class="lv_stage">
          <div class="container-large">
            <div class="lv_head">
              <h2 class="heading-style-h2">{{LV_TITLE}}</h2>
              <p class="text-size-medium">{{UI_LV_INTRO}}</p>
            </div>
            <div class="lv_body">
              <div class="lv_codes shadow-card" aria-hidden="true">
                <div class="lv_code">A1</div>
                <div class="lv_code">A2</div>
                <div class="lv_code">B1</div>
                <div class="lv_code">B2</div>
                <div class="lv_code">C1</div>
                <div class="lv_code">C2</div>
              </div>
              <div class="lv_texts">
                <div class="lv_text"><h3 class="heading-style-h3">{{UI_LV_1_H}}</h3><p class="text-size-large">{{UI_LV_1_P}}</p></div>
                <div class="lv_text"><h3 class="heading-style-h3">{{UI_LV_2_H}}</h3><p class="text-size-large">{{UI_LV_2_P}}</p></div>
                <div class="lv_text"><h3 class="heading-style-h3">{{UI_LV_3_H}}</h3><p class="text-size-large">{{UI_LV_3_P}}</p></div>
                <div class="lv_text"><h3 class="heading-style-h3">{{UI_LV_4_H}}</h3><p class="text-size-large">{{UI_LV_4_P}}</p></div>
                <div class="lv_text"><h3 class="heading-style-h3">{{UI_LV_5_H}}</h3><p class="text-size-large">{{UI_LV_5_P}}</p></div>
                <div class="lv_text"><h3 class="heading-style-h3">{{UI_LV_6_H}}</h3><p class="text-size-large">{{UI_LV_6_P}}</p></div>
              </div>
            </div>
            <div class="lv_track" aria-hidden="true"><div class="lv_fill"></div></div>
            <div class="lv_cta"><button type="button" class="button w-inline-block" data-quiz-open><p>{{UI_QUIZ_BTN_LONG}}</p><img src="images/icon-arrow-light.svg" loading="lazy" alt="" class="icon-16"></button></div>
          </div>
        </div>
        <script>
          (function () {
            var root = document.currentScript.closest(".lv");
            var codes = [].slice.call(root.querySelectorAll(".lv_code")), texts = [].slice.call(root.querySelectorAll(".lv_text"));
            var current = -1;
            function update() {
              var r = root.getBoundingClientRect(), range = root.offsetHeight - window.innerHeight;
              var p = Math.min(1, Math.max(0, -r.top / range));
              root.style.setProperty("--lv-p", p.toFixed(3));
              var k = Math.min(codes.length - 1, Math.floor(p * codes.length));
              if (k === current) return;
              current = k;
              [codes, texts].forEach(function (list) {
                list.forEach(function (el, i) {
                  el.classList.toggle("is-on", i === k);
                  el.classList.toggle("is-before", i < k);
                });
              });
            }
            window.addEventListener("scroll", update, { passive: true });
            window.addEventListener("resize", update);
            update();
          })();
        </script>
      </section>
