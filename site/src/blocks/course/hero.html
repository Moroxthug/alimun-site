      <section class="ch">
        <style>
          /* Course landing hero: the title and a rotating reason, then the city video grows from a card to the full screen while the page holds, and the class facts appear over it. */
          .ch { position: relative; height: 230vh; }
          .ch_stage { position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
          .ch_head { position: relative; z-index: 2; text-align: center; padding: 8.5rem 1.25rem 0; transform: translateY(calc(var(--ch-p, 0) * -40vh)); opacity: calc(1 - var(--ch-p, 0) * 1.6); }
          .ch_title { margin: 0; font-family: Coolvetica Condensed, sans-serif; font-weight: 400; text-transform: uppercase; line-height: .9; letter-spacing: -.02em; font-size: clamp(3.5rem, 10vw, 10rem); }
          .ch_title span { display: block; opacity: 0; transform: translateY(.45em); animation: chRise .9s cubic-bezier(.215, .61, .355, 1) forwards; }
          .ch_title span + span { animation-delay: .12s; }
          .ch_rotate { margin: 1.25rem 0 0; font-size: clamp(1.1rem, 1.8vw, 1.5rem); opacity: 0; animation: chRise .9s .3s cubic-bezier(.215, .61, .355, 1) forwards; }
          .ch_word { display: inline-block; background-color: var(--green); color: var(--black); padding: .05em .45em; border-radius: 5rem; transition: opacity .35s ease, transform .35s ease; }
          .ch_word.is-out { opacity: 0; transform: translateY(.4em); }
          @keyframes chRise { to { opacity: 1; transform: none; } }
          .ch_media { position: absolute; left: 50%; top: calc((1 - var(--ch-p, 0)) * var(--ch-top, 55vh)); width: calc(62vw + var(--ch-p, 0) * 38vw); height: calc((1 - var(--ch-p, 0)) * var(--ch-h, 40vh) + var(--ch-p, 0) * 100vh); transform: translateX(-50%); border-radius: calc((1 - var(--ch-p, 0)) * 2.25rem); overflow: hidden; background-color: var(--black); box-shadow: 0 30px 80px rgba(8, 8, 8, .18); }
          .ch_media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(calc(1.15 - var(--ch-p, 0) * .15)); }
          .ch_media::after { content: ""; position: absolute; inset: 0; background-color: rgba(8, 8, 8, calc(var(--ch-q, 0) * .55)); }
          .ch_over { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 1.5rem; color: var(--white); opacity: var(--ch-q, 0); transform: translateY(calc((1 - var(--ch-q, 0)) * 2rem)); pointer-events: none; }
          .ch_over.is-on { pointer-events: auto; }
          .ch_over h2 { margin: 0; font-family: Coolvetica Condensed, sans-serif; font-weight: 400; text-transform: uppercase; line-height: .95; font-size: clamp(2.5rem, 6vw, 5.5rem); max-width: 14ch; }
          .ch_over > p { margin: 1.25rem 0 0; max-width: 40rem; font-size: clamp(1rem, 1.4vw, 1.2rem); color: rgba(255, 255, 255, .85); }
          .ch_over .button { margin-top: 1.75rem; }
          @media (max-width: 767px) {
            .ch { height: 200vh; }
            .ch_head { padding-top: 7rem; }
            .ch_media { width: calc(88vw + var(--ch-p, 0) * 12vw); }
          }
        </style>
        <div class="ch_stage">
          <div class="ch_head">
            <h1 class="ch_title"><span>{{TITLE_1}}</span><span>{{TITLE_2}}</span></h1>
            <p class="ch_rotate">{{LEAD}} <span class="ch_word">{{WORD_1}}</span></p>
          </div>
          <div class="ch_media">
            <video autoplay loop muted playsinline poster="videos/{{VIDEO}}-poster-00001.jpg">
              <source src="videos/{{VIDEO}}-transcode.mp4" type="video/mp4">
              <source src="videos/{{VIDEO}}-transcode.webm" type="video/webm">
            </video>
            <div class="ch_over">
              <h2>{{OVER_TITLE}}</h2>
              <p>{{DESC}}</p>
              <a href="{{CTA_HREF}}" class="button w-inline-block"><p>{{CTA}}</p><img src="images/icon-arrow-light.svg" loading="lazy" alt="" class="icon-16"></a>
            </div>
          </div>
        </div>
        <script>
          (function () {
            var root = document.currentScript.closest(".ch"), over = root.querySelector(".ch_over"), head = root.querySelector(".ch_head");
            // The card starts just under the heading and fills the rest of the screen above a small margin.
            function measure() {
              var vh = window.innerHeight, top = head.offsetTop + head.offsetHeight + Math.max(24, vh * 0.04);
              root.style.setProperty("--ch-top", top + "px");
              root.style.setProperty("--ch-h", Math.max(vh * 0.28, vh - top - vh * 0.06) + "px");
            }
            // The section holds the screen: p runs 0 to 1 while the video grows, q fades the facts in over the last part.
            function update() {
              var r = root.getBoundingClientRect(), range = root.offsetHeight - window.innerHeight;
              var p = Math.min(1, Math.max(0, -r.top / (range * 0.7)));
              var q = Math.min(1, Math.max(0, (p - 0.6) / 0.4));
              root.style.setProperty("--ch-p", p.toFixed(3));
              root.style.setProperty("--ch-q", q.toFixed(3));
              over.classList.toggle("is-on", q > 0.5);
            }
            window.addEventListener("scroll", update, { passive: true });
            window.addEventListener("resize", function () { measure(); update(); });
            measure();
            update();
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measure(); update(); });
            // The highlighted reason changes every few seconds.
            var words = {{WORDS}}, el = root.querySelector(".ch_word"), i = 0;
            setInterval(function () {
              el.classList.add("is-out");
              setTimeout(function () { i = (i + 1) % words.length; el.textContent = words[i]; el.classList.remove("is-out"); }, 350);
            }, 2600);
          })();
        </script>
      </section>
