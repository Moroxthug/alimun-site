      <section class="section pl" data-no-currency>
        <style>
          /* Plans as a price ladder (pricing engine step 9, owner 12 Nov 2026): three columns of increasing height grow up from the baseline one after another; each holds the live price (js/prices.js, the visitor's currency, the course's language), the product and one sentence. No black column (owner, 26 Oct 2026). */
          .pl { padding: 6rem 0; }
          .pl_head { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; margin-bottom: 3rem; }
          .pl_head h2 { margin: 0; }
          .pl_head p { margin: 0; max-width: 30rem; color: rgba(8, 8, 8, .7); }
          .pl_row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; align-items: end; height: min(36rem, 72vh); }
          .pl_col { height: var(--h); display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; border-radius: 2.25rem; background-color: var(--white); transform-origin: center bottom; transform: scaleY(0); transition: transform 1.1s cubic-bezier(.215, .61, .355, 1); }
          .pl_col > * { opacity: 0; transition: opacity .6s ease; }
          .pl_row.is-in .pl_col { transform: none; }
          .pl_row.is-in .pl_col > * { opacity: 1; transition-delay: .7s; }
          .pl_row.is-in .pl_col:nth-child(2), .pl_row.is-in .pl_col:nth-child(2) > * { transition-delay: .15s; }
          .pl_row.is-in .pl_col:nth-child(2) > * { transition-delay: .85s; }
          .pl_row.is-in .pl_col:nth-child(3) { transition-delay: .3s; }
          .pl_row.is-in .pl_col:nth-child(3) > * { transition-delay: 1s; }
          .pl_col.is-green { background-color: var(--green); }
          .pl_price { margin: 0; font-family: Coolvetica Condensed, sans-serif; text-transform: uppercase; line-height: .9; font-size: clamp(3rem, 5vw, 4.75rem); }
          .pl_price small { font-family: Satoshi, sans-serif; text-transform: none; font-size: 1rem; margin-left: .25rem; }
          .pl_col h3 { margin: 0 0 .6rem; }
          .pl_col p.pl_desc { margin: 0; color: rgba(8, 8, 8, .75); }
          .pl_price span[hidden] { display: inline; visibility: hidden; }
          .pl_cta { margin-top: 2.5rem; display: flex; justify-content: center; }
          @media (max-width: 767px) {
            .pl_head { flex-direction: column; align-items: flex-start; }
            .pl_row { grid-template-columns: 1fr; height: auto; }
            .pl_col { height: auto; min-height: 13rem; gap: 2rem; transform-origin: left center; transform: scaleX(0); }
          }
        </style>
        <div class="container-large">
          <div class="pl_head">
            <h2 class="heading-style-h2">{{UI_PL_TITLE}}</h2>
            <p class="text-size-medium">{{UI_PL_DESC}}</p>
          </div>
          <div class="pl_row">
            <div class="pl_col shadow-card" style="--h: 60%">
              <p class="pl_price"><span data-pp-text="price=open_{{PRODUCT_LANG}}:month">{price}</span><small>{{UI_PL_MONTH}}</small></p>
              <div><h3 class="heading-style-h4">{{UI_PL_N1}}</h3><p class="text-size-small pl_desc">{{UI_PL_1}}</p></div>
            </div>
            <div class="pl_col is-green shadow-card" style="--h: 85%">
              <p class="pl_price"><span data-pp-text="price=level_{{PRODUCT_LANG}}:month">{price}</span><small>{{UI_PL_MONTH}}</small></p>
              <div><h3 class="heading-style-h4">{{UI_PL_N2}}</h3><p class="text-size-small pl_desc">{{UI_PL_2}}</p></div>
            </div>
            <div class="pl_col shadow-card" style="--h: 100%">
              <p class="pl_price"><span data-pp-text="price=exam_{{PRODUCT_LANG}}:month">{price}</span><small>{{UI_PL_MONTH}}</small></p>
              <div><h3 class="heading-style-h4">{{UI_PL_N3}}</h3><p class="text-size-small pl_desc">{{UI_PL_3}}</p></div>
            </div>
          </div>
          <div class="pl_cta">
            <a href="{{CTA_HREF}}" class="button w-inline-block"><p>{{UI_PL_CTA}}</p><img src="images/icon-arrow-light.svg" loading="lazy" alt="" class="icon-16"></a>
          </div>
        </div>
        <script>
          (function () {
            var row = document.currentScript.closest(".pl").querySelector(".pl_row");
            if (!("IntersectionObserver" in window)) { row.classList.add("is-in"); return; }
            var io = new IntersectionObserver(function (e) { if (e[0].isIntersecting) { row.classList.add("is-in"); io.disconnect(); } }, { threshold: 0.3 });
            io.observe(row);
          })();
        </script>
        <script src="js/prices.js" defer></script>
      </section>
