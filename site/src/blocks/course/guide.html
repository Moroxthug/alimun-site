      <section class="section gd">
        <style>
          /* Guide: pure text in an editorial layout. Each block fades and rises as it reaches the middle of the screen. */
          .gd { padding: 7rem 0; }
          .gd_head { max-width: 58rem; margin-bottom: 4.5rem; }
          .gd_head h2 { margin: 0 0 1.75rem; }
          .gd_lead { margin: 0; font-size: clamp(1.35rem, 2.2vw, 1.9rem); line-height: 1.4; }
          .gd_row { display: grid; grid-template-columns: 4fr 7fr; gap: 3rem; padding: 3rem 0; border-top: 1px solid rgba(8, 8, 8, .12); }
          .gd_row h3 { margin: 0; max-width: 22rem; }
          .gd_text p { margin: 0; color: rgba(8, 8, 8, .78); }
          .gd_text p + p { margin-top: 1.25rem; }
          .gd .gd_lead, .gd_row { opacity: calc(.12 + var(--gd, 0) * .88); transform: translateY(calc((1 - var(--gd, 0)) * 2.5rem)); }
          @media (max-width: 767px) {
            .gd { padding: 5rem 0; }
            .gd_head { margin-bottom: 2.5rem; }
            .gd_row { grid-template-columns: 1fr; gap: 1rem; padding: 2rem 0; }
          }
        </style>
        <div class="container-large">
          <div class="gd_head">
            <h2 class="heading-style-h2">{{GUIDE_TITLE}}</h2>
            <p class="gd_lead">{{GUIDE_LEAD}}</p>
          </div>
{{GUIDE_ROWS}}
        </div>
        <script>
          (function () {
            var blocks = [].slice.call(document.currentScript.closest(".gd").querySelectorAll(".gd_lead, .gd_row"));
            function update() {
              var vh = window.innerHeight;
              blocks.forEach(function (b) {
                var top = b.getBoundingClientRect().top;
                var p = Math.min(1, Math.max(0, (vh * 0.95 - top) / (vh * 0.4)));
                b.style.setProperty("--gd", p.toFixed(3));
              });
            }
            window.addEventListener("scroll", update, { passive: true });
            window.addEventListener("resize", update);
            update();
          })();
        </script>
      </section>
