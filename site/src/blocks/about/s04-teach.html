      <section class="section teach">
        <style>
          .teach_card { background-color: var(--black); color: var(--white); border-radius: 3.125rem; padding: 6rem 3rem; text-align: center; display: flex; flex-direction: column; align-items: center; transform: scale(calc(.88 + var(--teach-p, 1) * .12)); opacity: calc(.3 + var(--teach-p, 1) * .7); }
          .teach_card h2 { margin: 0; }
          .teach_text { max-width: 40rem; margin: 1.75rem auto 0; opacity: .8; }
          .teach .button { margin-top: 2rem; width: fit-content; }
          @media (max-width: 767px) { .teach_card { padding: 4rem 1.5rem; border-radius: 2.25rem; } }
          @media (prefers-reduced-motion: reduce) { .teach_card { transform: none; opacity: 1; } }
        </style>
        <div class="container-large">
          <div class="teach_card">
            <h2 class="heading-style-h1" data-i18n="about_teach_title">Teach with Alimun</h2>
            <p class="text-size-large teach_text" data-i18n="about_teach_desc">Are you a language teacher? We are building our teaching team. See how teaching at Alimun works and apply on our careers page.</p>
            <a href="careers.html" class="button w-inline-block">
              <p data-i18n="about_teach_btn">See careers</p><img src="images/icon-arrow-light.svg" loading="lazy" alt="" class="icon-16">
            </a>
          </div>
        </div>
        <script>
          // The card grows to full size as it scrolls into view.
          (function () {
            var root = document.currentScript.closest(".teach");
            var card = root.querySelector(".teach_card");
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            function update() {
              var r = root.getBoundingClientRect(), vh = window.innerHeight;
              var p = Math.min(1, Math.max(0, (vh - r.top) / (vh * 0.7)));
              card.style.setProperty("--teach-p", p.toFixed(3));
            }
            window.addEventListener("scroll", update, { passive: true });
            window.addEventListener("resize", update);
            update();
          })();
        </script>
      </section>
