:root { --g:#ceff65; --b:#080808; --body:'Satoshi',sans-serif; --disp:'Anton',sans-serif; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--body); background:#f0efe9; min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

.card{
  background:#fff; border-radius:1.5rem;
  width:100%; max-width:420px;
  box-shadow:0 8px 40px rgba(0,0,0,.08);
  overflow:hidden;
}
.card-head{ padding:1.5rem 1.75rem 1.125rem; border-bottom:1px solid rgba(0,0,0,.07); }
.card-eyebrow{ font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:#aaa; margin-bottom:.3rem; }
.card-title{ font-family:var(--disp); font-size:1.5rem; text-transform:uppercase; line-height:1.05; }

.card-body{ padding:1.375rem 1.75rem 1.5rem; }
.card-body p.hint{ font-size:.82rem; color:#888; line-height:1.55; margin-bottom:1.125rem; }

.field{ margin-bottom:1rem; }
.field label{ display:block; font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#888; margin-bottom:.5rem; }
.field input{
  width:100%; background:#fafaf8; border:1.5px solid rgba(0,0,0,.1); border-radius:.75rem;
  padding:.875rem 1.125rem; font-family:var(--body); font-size:.9rem; color:var(--b); outline:none;
  transition:border-color .18s, box-shadow .18s;
}
.field input:focus{ border-color:var(--b); box-shadow:0 0 0 3px rgba(206,255,101,.35); }
.field input::placeholder{ color:#ccc; }

.btn{
  width:100%; background:var(--g); color:var(--b); border:none; border-radius:5rem;
  padding:.875rem; font-family:var(--body); font-weight:700; font-size:.82rem;
  text-transform:uppercase; letter-spacing:.055em; cursor:pointer; margin-top:.5rem;
  transition:background .22s;
}
.btn:hover{ background:#b3e940; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }

.error-msg{
  display:none; margin-top:.875rem;
  background:#fff0f0; border:1px solid #fca5a5; border-radius:.625rem;
  padding:.65rem 1rem; font-size:.8rem; color:#dc2626; line-height:1.45;
}

.success-box{ display:none; text-align:center; padding:.5rem 0 1rem; }
.success-ico{
  width:48px; height:48px; border-radius:50%; background:var(--g);
  display:flex; align-items:center; justify-content:center; margin:0 auto 1.125rem;
}
.success-ico svg{ width:22px; height:22px; stroke:var(--b); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.success-box h2{ font-family:var(--disp); font-size:1.25rem; text-transform:uppercase; margin-bottom:.5rem; }
.success-box p{ font-size:.85rem; color:#888; line-height:1.6; }

.footer{ padding:.875rem 2rem; text-align:center; flex-shrink:0; }
.footer p{ font-size:.75rem; color:#bbb; }
.footer a{ color:#aaa; text-decoration:none; }
.footer a:hover{ color:var(--b); }

<div class="auth-topstrip">

    <img src="../images/Alimun-Source-File-fixes.svg" alt="Alimun Logo">

<div class="auth-form-center">
  <div class="card">
    <div class="card-head">
      <div class="card-eyebrow" data-i18n="reset_eyebrow">Account recovery</div>
      <div class="card-title" data-i18n="reset_title">Choose a new password</div>
    </div>
    <div class="card-body">
      <div id="reset-view">
        <p class="hint" id="reset-hint" data-i18n="reset_hint">Enter a new password for your account below.</p>
        <div class="field">
          <label data-i18n="reset_new_password">New password</label>
          <input type="password" placeholder="At least 8 characters" id="pw-input">
        </div>
        <div class="field">
          <label data-i18n="reset_confirm_password">Confirm password</label>
          <input type="password" placeholder="Repeat your new password" id="pw-confirm-input">
        </div>
        <button class="btn" id="reset-btn" onclick="updatePassword()" data-i18n="reset_btn_update">Update password →</button>
        <div class="error-msg" id="error-msg"></div>
      </div>
      <div class="success-box" id="success-view">
        <div class="success-ico"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <h2 data-i18n="reset_done_title">Password updated</h2>
        <p data-i18n="reset_done_desc">Your password has been changed. You can now sign in with your new password.</p>
        <br>
        <a href="signin.html" class="btn" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;" data-i18n="reset_btn_signin">Sign in →</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from '/js/supabase/config.js';

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError() {
  const el = document.getElementById('error-msg');
  el.style.display = 'none';
  el.textContent = '';
}

// The recovery link Supabase emails contains an access token in the URL,
// which the client (detectSessionInUrl: true) exchanges for a session
// automatically on load. If that never happens, there's no valid link.
let hasRecoverySession = false;
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
    hasRecoverySession = true;
  }
});

window.updatePassword = async function() {
  clearError();
  const pw      = document.getElementById('pw-input').value;
  const pwAgain = document.getElementById('pw-confirm-input').value;

  if (pw.length < 8) {
    showError('Password must be at least 8 characters.');
    return;
  }
  if (pw !== pwAgain) {
    showError('Passwords do not match.');
    return;
  }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.textContent = 'Updating…';

  const { error } = await supabase.auth.updateUser({ password: pw });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Update password →';
    showError(error.message || 'Could not update your password. The link may have expired — request a new one.');
    return;
  }

  document.getElementById('reset-view').style.display = 'none';
  document.getElementById('success-view').style.display = 'block';
};

document.getElementById('pw-confirm-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.updatePassword();
});
</script>
