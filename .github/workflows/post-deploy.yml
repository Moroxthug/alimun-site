name: Production smoke test

on:
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test alimun.com (IMPLEMENTATION_PLAN.md §5)
        id: smoke
        run: |
          set -o pipefail
          bash scripts/ci/smoke-prod.sh | tee smoke.log
      - name: Open an issue on failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Production smoke test failed"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          body=$(printf 'Run: %s/%s/actions/runs/%s\n\n```\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat smoke.log)")
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
