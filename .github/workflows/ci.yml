name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Machines are pinned to ubuntu-24.04: "ubuntu-latest" moved to 26.04, which Playwright 1.56 cannot install a browser
# on, and every browser job had failed since (25 Nov 2026).

jobs:
  checks:
    name: Syntax, build, function cap, links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: node --check on api/, js/ and every inline script
        run: node scripts/ci/check-inline-scripts.js
      - name: Unit tests (strict CommonJS, like the Vercel runtime)
        run: node --no-experimental-require-module --test 'tests/unit/*.test.js'
      - name: Serverless function cap (guard against splitting handlers)
        run: node scripts/ci/check-function-count.js
      - name: Build locales and require no diff
        run: |
          npm run build
          git diff --exit-code --stat || { echo "::error::Locale copies are out of date. Run npm run build and commit the result."; exit 1; }
      - name: Local links and sitemap
        run: node scripts/ci/check-links.js

  app-speed:
    name: App speed budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: The app is ready in under a second on a repeat visit (docs/APP_PLAN.md, step 2)
        run: npx playwright test tests/smoke/app-speed.spec.js --trace off

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner -v

  dependencies:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: pip install semgrep==1.180.0
      - name: Extract inline scripts from root HTML (locales are generated copies)
        run: |
          EXTRACT_DIR=.inline-js node scripts/ci/check-inline-scripts.js
          find .inline-js -name '[a-z][a-z]__*' -delete
      - name: House rules (escapeHtml on innerHTML, no service role in browser)
        run: semgrep scan --metrics=off --error --config .semgrep/alimun.yml --exclude node_modules --exclude 'ar' --exclude 'de' --exclude 'es' --exclude 'fr' --exclude 'it' --exclude 'ma' --exclude 'pt' --exclude 'zh' --exclude js/webflow.js .
      - name: Registry rules (blocking on ERROR severity)
        run: semgrep scan --metrics=off --error --severity ERROR --config p/javascript --config p/xss --config p/secrets --exclude node_modules --exclude js/webflow.js --exclude 'ar' --exclude 'de' --exclude 'es' --exclude 'fr' --exclude 'it' --exclude 'ma' --exclude 'pt' --exclude 'zh' .

  smoke:
    name: Playwright smoke (preview mode)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: '1'

  # The one check Vercel waits for before putting a commit live on alimun.com (owner, 25 Nov 2026: deploy gate).
  # Vercel → Settings → Build and Deployment → Deployment Checks → GitHub → "Deploy gate". Every push to main still
  # builds, but the build only gets the alimun.com domains when this passes; otherwise the site stays on the last good
  # build. Keep this job's name: Vercel finds the check by it. Add a job here to make it part of the gate.
  gate:
    name: Deploy gate
    if: always()
    needs: [checks, app-speed, secrets, dependencies, semgrep, smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const bad = Object.entries(JSON.parse(s)).filter(([, v]) => v.result !== "success");
              for (const [k, v] of bad) console.log("::error::" + k + ": " + v.result);
              if (bad.length) { console.log("Not deploying: fix the jobs above, or Force Promote in Vercel for an emergency."); process.exit(1); }
              console.log("All required jobs passed.");
            });'
