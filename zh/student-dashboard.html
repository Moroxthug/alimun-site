<!DOCTYPE html><html lang="zh" dir="ltr"><head>
<meta charset="utf-8">
<!-- The students' dashboard is at /app (docs/DASHBOARD_PLAN.md, step 16). The old student dashboard was deleted on the
     owner's request (26 Oct 2026); this address only forwards. Links already sent keep working: a waiting-list claim
     (?claim_cohort_id=&waitlist_id=) opens the offer, a return from Stripe (?checkout=, ?join=) is shown, an admin's
     ?as=<student profile id> opens that dashboard read-only, and ?preview=1 opens the sample. -->
<script>(function () {
  var q = new URLSearchParams(location.search), id = /^[0-9a-f-]{36}$/i, out = new URLSearchParams(), hash = '';
  if (id.test(q.get('waitlist_id') || '')) hash = '#/classes/offer/' + q.get('waitlist_id');
  if (/^(success|cancelled|credit)$/.test(q.get('checkout') || '')) out.set('checkout', q.get('checkout'));
  if (id.test(q.get('join') || '')) out.set('join', q.get('join'));
  if (id.test(q.get('as') || '')) out.set('as', q.get('as'));
  if (q.has('preview')) out.set('sample', '1');
  location.replace('/app' + (out.toString() ? '?' + out.toString() : '') + hash);
})();</script>
<title>Alimun</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
