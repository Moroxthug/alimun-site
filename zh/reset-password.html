<meta charset="utf-8">

<link href="/images/favicon.svg?v=2" rel="icon" type="image/svg+xml"><link href="/images/favicon-48.png?v=2" rel="icon" type="image/png" sizes="48x48"><link href="/images/favicon.ico?v=2" rel="shortcut icon" type="image/x-icon"><link href="/images/webclip.png?v=2" rel="apple-touch-icon">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link href="../css/auth.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js" integrity="sha384-nD3dwv4+ZqdYnmZKe/249ImlV04om7xTCcsoSeQYI+RO+XlKPoqAWaJR1M5SJH9p" crossorigin="anonymous"></script>
<script>
  window.ALIMUN_CONFIG = {
    supabaseUrl:     'https://dgaiasmefcbrtzqwdyri.supabase.co',
    supabaseAnonKey: 'sb_publishable_6epxmytr0e38p6OI77U_NQ_8pFzrzlh',
  };
</script>
<script src="../js/i18n/en.js" defer=""></script><script src="../js/i18n/zh.js" defer=""></script>
<script src="../js/i18n.js" defer=""></script>
</head>
<body>
<!-- Reset password: only the emailed link (?token_hash=…, checked when the form is sent, or a PASSWORD_RECOVERY session) unlocks the form, so an
     ordinary signed-in session on a shared computer cannot change the password here. -->
<div class="au">
  <main class="au_main">
    <div class="au_top">
      <a class="au_logo" href="index.html"><img src="../images/alimun-logo.svg" alt="Alimun"></a>
      <span class="au_toplink"><a href="signin.html" data-i18n="au_back_signin">返回登录</a></span>
    </div>
    <div class="au_body">
      <div class="au_box">
        <section class="au_step" id="s-reset">
          <h1 class="au_h1" data-i18n="au_reset_title">设置新密码</h1>
          <p class="au_lead" data-i18n="au_reset_lead">请至少使用 8 个字符，并包含小写字母、大写字母和数字。你在其他设备上的登录将被退出。</p>
          <form class="au_form" id="f-reset" novalidate="">
            <div class="au_field"><label for="i-pw" data-i18n="au_new_password">新密码</label>
              <div class="au_pw"><input class="au_input" id="i-pw" type="password" autocomplete="new-password" minlength="8" required=""><button type="button" class="au_eye" data-eye="i-pw" data-i18n="au_show">显示</button></div>
            </div>
            <div class="au_field"><label for="i-pw2" data-i18n="au_repeat_password">再次输入新密码</label>
              <div class="au_pw"><input class="au_input" id="i-pw2" type="password" autocomplete="new-password" minlength="8" required=""><button type="button" class="au_eye" data-eye="i-pw2" data-i18n="au_show">显示</button></div>
            </div>
            <p class="au_msg" id="m-reset" role="alert"></p>
            <button type="submit" class="au_btn" id="b-reset"><span data-i18n="au_save_password">保存新密码</span></button>
          </form>
          <p class="au_alt"><a href="forgot-password.html" data-i18n="au_new_link">重新获取链接</a></p>
        </section>
        <section class="au_step" id="s-done" hidden="">
          <h1 class="au_h1" data-i18n="au_reset_done_title">密码已更改</h1>
          <p class="au_lead" data-i18n="au_reset_done_lead">你的新密码已保存。请使用新密码登录以继续。</p>
          <div class="au_actions"><a class="au_btn" href="signin.html"><span data-i18n="au_signin">登录</span></a></div>
        </section>
      </div>
    </div>
    <div class="au_foot">
      <a href="index.html" data-i18n="auth_back_to_alimun">← 返回 Alimun</a>
      <a href="terms.html" data-i18n="auth_terms">条款</a>
      <a href="gdpr.html" data-i18n="auth_gdpr">GDPR</a>
      <a href="cookies.html" data-i18n="auth_cookies">Cookie</a>
      <button type="button" id="open-cookie-settings" data-i18n="auth_manage_cookies">管理 Cookie</button>
    </div>
  </main>
  <aside class="au_side" aria-hidden="true">
    <div class="au_media"><img src="../images/pexels-julia-m-cameron-4145153.jpg" alt=""></div>
  </aside>
</div>

<div hidden="">
  <span data-i18n="au_hide">隐藏</span>
  <span data-i18n="au_waiting">请稍候…</span>
  <span data-i18n="au_err_pw">密码至少需要 8 个字符，并包含小写字母、大写字母和数字。</span>
  <span data-i18n="au_err_match">两次输入的密码不一致。</span>
  <span data-i18n="au_err_link">此链接已过期或已被使用，请重新获取。</span>
</div>

<script type="module">
import { supabase, getUserRole } from '/js/supabase/config.js';
const $ = (id) => document.getElementById(id);
const t = (k) => { const el = document.querySelector(`[hidden] [data-i18n="${k}"]`); return el ? el.textContent : k; };
function show(id) { document.querySelectorAll('.au_step').forEach((s) => { s.hidden = s.id !== id; }); }
function msg(id, text) { const el = $(id); el.textContent = text; el.classList.toggle('is-on', !!text); }
document.querySelectorAll('[data-eye]').forEach((b) => b.addEventListener('click', () => {
  const input = $(b.getAttribute('data-eye'));
  if (input.type === 'password') { b.dataset.show = b.textContent; b.textContent = t('au_hide'); input.type = 'text'; }
  else { b.textContent = b.dataset.show; input.type = 'password'; }
}));

let recovery = false;
supabase.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') recovery = true; });
// Links emailed by api/auth.js (reset) and api/admin/teacher.js (invite) carry ?token_hash=…&type=recovery|invite.
// The token is only used when the person saves a password, so a mail scanner opening the link does not use it up.
const qs = new URLSearchParams(location.search);
const tokenHash = qs.get('token_hash') || '';
const tokenType = ['recovery', 'invite'].includes(qs.get('type')) ? qs.get('type') : '';
// Expired or used links arrive with an error in the address (e.g. #error_code=otp_expired).
(() => {
  const h = new URLSearchParams((location.hash || '').replace(/^#/, '')), q = new URLSearchParams(location.search);
  if (h.get('error') || h.get('error_code') || q.get('error') || q.get('error_code')) { msg('m-reset', t('au_err_link')); $('b-reset').disabled = true; }
})();

$('f-reset').addEventListener('submit', async (e) => {
  e.preventDefault(); msg('m-reset', '');
  const pw = $('i-pw').value, pw2 = $('i-pw2').value;
  if (!(pw.length >= 8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /[0-9]/.test(pw))) return msg('m-reset', t('au_err_pw'));
  if (pw !== pw2) return msg('m-reset', t('au_err_match'));
  if (!recovery && !(tokenHash && tokenType)) return msg('m-reset', t('au_err_link'));
  const btn = $('b-reset'), label = btn.innerHTML;
  btn.disabled = true; btn.textContent = t('au_waiting');
  if (!recovery) {
    const { error: otpErr } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: tokenType });
    if (otpErr) { btn.disabled = false; btn.innerHTML = label; return msg('m-reset', t('au_err_link')); }
    recovery = true;
  }
  const { error } = await supabase.auth.updateUser({ password: pw });
  if (error) {
    btn.disabled = false; btn.innerHTML = label;
    // Auth messages such as "New password should be different" are shown as they are; session problems mean the link expired.
    if (error.code === 'weak_password' || /should contain|weak/i.test(error.message || '')) return msg('m-reset', t('au_err_pw'));
    return msg('m-reset', /session|expired|jwt/i.test(error.message || '') ? t('au_err_link') : (error.message || t('au_err_link')));
  }
  // Sign out every other session of this account (AUTH-02).
  try { await supabase.auth.signOut({ scope: 'others' }); } catch (err) {}
  // A new account from an invite goes straight on to its dashboard (students first finish their welcome steps).
  if (tokenType === 'invite') {
    const { data: { user } } = await supabase.auth.getUser();
    const role = getUserRole(user);
    const base = location.pathname.replace(/[^/]*$/, '');
    location.replace(role === 'teacher' ? '/app/teach' : role === 'admin' ? '/app/admin' : base + 'welcome.html');
    return;
  }
  show('s-done');
});
</script>
<script src="../js/cookies-banner.js" type="text/javascript"></script>


</body></html>
