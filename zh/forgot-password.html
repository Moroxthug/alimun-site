<!DOCTYPE html><html lang="zh" dir="ltr"><head>
<meta charset="utf-8">
<title>重置密码 – Alimun</title>
<link href="/images/favicon.svg?v=2" rel="icon" type="image/svg+xml"><link href="/images/favicon-48.png?v=2" rel="icon" type="image/png" sizes="48x48"><link href="/images/favicon.ico?v=2" rel="shortcut icon" type="image/x-icon"><link href="/images/webclip.png?v=2" rel="apple-touch-icon">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link href="../css/auth.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js" integrity="sha384-nD3dwv4+ZqdYnmZKe/249ImlV04om7xTCcsoSeQYI+RO+XlKPoqAWaJR1M5SJH9p" crossorigin="anonymous"></script>
<script>
  window.ALIMUN_CONFIG = {
    supabaseUrl:     'https://dgaiasmefcbrtzqwdyri.supabase.co',
    supabaseAnonKey: 'sb_publishable_6epxmytr0e38p6OI77U_NQ_8pFzrzlh',
  };
</script>
<script src="../js/i18n/en.js" defer=""></script><script src="../js/i18n/zh.js" defer=""></script>
<script src="../js/i18n.js" defer=""></script>
</head>
<body>
<!-- Forgot password: Supabase emails a recovery link that opens reset-password.html. -->
<div class="au">
  <main class="au_main">
    <div class="au_top">
      <a class="au_logo" href="index.html"><img src="../images/alimun-logo.svg" alt="Alimun"></a>
      <span class="au_toplink"><a href="signin.html" data-i18n="au_back_signin">返回登录</a></span>
    </div>
    <div class="au_body">
      <div class="au_box">
        <section class="au_step" id="s-ask">
          <h1 class="au_h1" data-i18n="au_forgot_title">忘记密码？</h1>
          <p class="au_lead" data-i18n="au_forgot_lead">输入你的账户邮箱，我们会向你发送一个设置新密码的链接。</p>
          <form class="au_form" id="f-ask" novalidate="">
            <div class="au_field"><label for="i-email" data-i18n="au_email">电子邮箱</label><input class="au_input" id="i-email" type="email" autocomplete="email" required=""></div>
            <p class="au_msg" id="m-ask" role="alert"></p>
            <button type="submit" class="au_btn" id="b-ask"><span data-i18n="au_send_link">发送链接</span></button>
          </form>
        </section>
        <section class="au_step" id="s-sent" hidden="">
          <p class="au_big" aria-hidden="true">@</p>
          <h1 class="au_h1" data-i18n="au_check_title">请查收邮件</h1>
          <p class="au_lead"><span data-i18n="au_reset_sent">如果</span> <b id="sent-email"></b><span data-i18n="au_reset_sent2">已注册账户，设置新密码的链接正在发送途中。邮件可能需要一两分钟才能送达。</span></p>
          <div class="au_actions"><a class="au_btn is-ghost" href="signin.html"><span data-i18n="au_back_signin">返回登录</span></a></div>
        </section>
      </div>
    </div>
    <div class="au_foot">
      <a href="index.html" data-i18n="auth_back_to_alimun">← 返回 Alimun</a>
      <a href="terms.html" data-i18n="auth_terms">条款</a>
      <a href="gdpr.html" data-i18n="auth_gdpr">GDPR</a>
      <a href="cookies.html" data-i18n="auth_cookies">Cookie</a>
      <button type="button" id="open-cookie-settings" data-i18n="auth_manage_cookies">管理 Cookie</button>
    </div>
  </main>
  <aside class="au_side" aria-hidden="true">
    <div class="au_media"><img src="../images/pexels-julia-m-cameron-4145153.jpg" alt=""></div>
  </aside>
</div>

<div hidden="">
  <span data-i18n="au_waiting">请稍候…</span>
  <span data-i18n="au_err_email">请输入有效的电子邮箱地址。</span>
  <span data-i18n="au_err_rate">尝试次数过多，请等待几分钟后再试。</span>
  <span data-i18n="au_err_generic">出了点问题，请重试。</span>
</div>

<script type="module">
import { supabase } from '/js/supabase/config.js';
const $ = (id) => document.getElementById(id);
const t = (k) => { const el = document.querySelector(`[hidden] [data-i18n="${k}"]`); return el ? el.textContent : k; };
function show(id) { document.querySelectorAll('.au_step').forEach((s) => { s.hidden = s.id !== id; }); }
function msg(id, text) { const el = $(id); el.textContent = text; el.classList.toggle('is-on', !!text); }

$('f-ask').addEventListener('submit', async (e) => {
  e.preventDefault(); msg('m-ask', '');
  const email = $('i-email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg('m-ask', t('au_err_email'));
  const btn = $('b-ask'), label = btn.innerHTML;
  btn.disabled = true; btn.textContent = t('au_waiting');
  const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}/reset-password.html` });
  btn.disabled = false; btn.innerHTML = label;
  if (error) { console.error('[Alimun] resetPasswordForEmail:', error); return msg('m-ask', /rate|too many|seconds/i.test(error.message || '') ? t('au_err_rate') : t('au_err_generic')); }
  $('sent-email').textContent = email;
  show('s-sent');
});
</script>
<script src="../js/cookies-banner.js" type="text/javascript"></script>


</body></html>
